# ============================================================================
# 🧪 判负 fixture —— **故意损坏**的 clash（mihomo）地区组 filter，
#    供 clash 侧审计器的判别力回归使用。
#
# 损坏点（三处，都是"故意把常见写法删掉"，对应三类不同的判据）：
#   ① `Taiwan` 的正向半串里**删掉**关键词 `台` —— 只留 TW / Taiwan / Tai。
#      ⇒ 判据 ②（必备关键词覆盖）、判据 ③（本地区样本实测）应当判负，
#        输出里会点名 `台` —— 这就是回归测试要找的**定位标记**。
#   ② `Japan` 的正向半串里**删掉** `日` 与 `JP`，只留 `(?i)Japan`。
#      ⇒ 「日本 01」这种纯中文命名进不了 `Japan`；判据 ② / ③ 判负。
#   ③ `Other Regions` 的排除块里**删掉** `Taiwan|Tai` 这两个词。
#      ⇒ 判据 ⑤（拷贝同步）判负：`Taiwan` 组有、`Other Regions` 没有 ⇒
#        含 "Taiwan" 的节点会同时落进两个组。
#
# 定位标记为什么选 `台`
# ————————————
# 它必须：① 是合法正则片段、② 能让审计器**点名到这一个词**（判据 ② 逐词比对）、
# ③ 出现在判负输出里。三条都满足（见上面 ①）。
# ⚠️ 与 Surge / Egern 侧 fixture 的区别：那两侧注入的是**多出来的**未同步词，
#    本侧删的是**本该有的**词 —— mihomo 的判据是"关键词覆盖"，删词才测得出来。
#
# 期望：`self-conf-skills/run/clash/audit_region_filters.py` 以**退出码 1** 判负，
#       由 `self-conf-skills/gates/check_region_filters.py` 断言（退出码 1 + 输出含 `台`）。
#
# ⚠️ 本文件**不是**可导入的配置，只是审计器的测试输入；
#    不要引用它、也不要"修好"它 —— 它被判负**正是**它存在的意义。
# ============================================================================
proxy-groups:
  - name: Hong Kong
    type: url-test
    include-all-proxies: true
    filter: '(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Taiwan
    type: url-test
    include-all-proxies: true
    # ❌ 损坏①：删掉了 `台`（原本 `台|TW|(?i)Taiwan|Tai`）
    filter: '(?=.*(TW|(?i)Taiwan|Tai))^((?!(港|韩|新|美|日)).)*$'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Japan
    type: url-test
    include-all-proxies: true
    # ❌ 损坏②：删掉了 `日` 与 `JP`（原本 `日|JP|(?i)Japan`）
    filter: '(?=.*((?i)Japan))^((?!(港|台|韩|新|美)).)*$'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Singapore
    type: url-test
    include-all-proxies: true
    filter: '(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: United States
    type: url-test
    include-all-proxies: true
    filter: '(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Other Regions
    type: url-test
    include-all-proxies: true
    # ❌ 损坏③：排除块里删掉了 `Taiwan|Tai`
    filter: '^(?!(.*(港|HK|Hong|台|TW|日|JP|Japan|新加坡|坡|狮城|SG|Singapore|美|US|States|America|洛杉矶|硅谷|西雅图|纽约|东京|大阪|LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|NRT|HND|KIX|FUK|TPE|SIN)))(?!(.*(剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB|倍率|测试|有效|禁止|邮箱|客服|地址|网站|群组))).+$'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
proxies: []
