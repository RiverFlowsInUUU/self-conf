#! version=routing_v1.0.0
ipv6: false
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://connect.rom.miui.com/generate_204
real_ip_domains:
- '*.lan'
- '*.local'
- '*.push.apple.com'
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query
    - tls://223.5.5.5
    - https://120.53.53.53/dns-query
    - tls://1.12.12.12
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-direct.list
      value: Domestic-DNS
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list
      value: reject
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
      value: reject
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - tls://223.5.5.5
  - https://120.53.53.53/dns-query
  - tls://1.12.12.12
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
policy_groups:
- select:
    name: Proxy
    policies:
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    - Other Regions
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Proxy.png
- smart:
    name: Smart
    policies:
    - Airport
    flatten: true
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Auto.png
- select:
    name: ChatGPT
    policies:
    - United States
    - Taiwan
    - Japan
    - Singapore
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/openai.png
- select:
    name: Gemini
    policies:
    - United States
    - Taiwan
    - Japan
    - Singapore
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/gemini-color.png
- select:
    name: Claude
    policies:
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/claude-color.png
- select:
    name: AI
    policies:
    - Smart
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/grok.png
- select:
    name: YouTube
    policies:
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/YouTube.png
- select:
    name: Emby
    policies:
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Emby.png
- select:
    name: Google
    policies:
    - Gemini
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Google.png
- select:
    name: Telegram
    policies:
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Telegram.png
- select:
    name: YouTube Music
    policies:
    - United States
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/YouTubeMusic.png
- select:
    name: Spotify
    policies:
    - United States
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Spotify.png
- select:
    name: Twitter
    policies:
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Twitter.png
- external:
    name: Airport
    type: smart
    urls:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    urls_disabled:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    interval: 86400
    hidden: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Airport.png
- select:
    name: Microsoft
    policies:
    - DIRECT
    - Proxy
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Microsoft.png
- select:
    name: Apple Update
    policies:
    - DIRECT
    - REJECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Apple.png
- select:
    name: AD
    policies:
    - REJECT
    - DIRECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/AdBlock.png
- smart:
    name: Hong Kong
    policies:
    - Airport
    flatten: true
    filter: (?i)🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/HongKong.png
- smart:
    name: Taiwan
    policies:
    - Airport
    flatten: true
    filter: (?i)🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Taiwan.png
- smart:
    name: Japan
    policies:
    - Airport
    flatten: true
    filter: (?i)🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Japan.png
- smart:
    name: Singapore
    policies:
    - Airport
    flatten: true
    filter: (?i)🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Singapore.png
- smart:
    name: United States
    policies:
    - Airport
    flatten: true
    filter: (?i)🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/UnitedStates.png
- smart:
    name: Other Regions
    policies:
    - Airport
    flatten: true
    filter: |-
      (?xi) ^ (?! .* (?:
        🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|
        🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|
        🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|
        🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|
        🇺🇸|美国|United\s*States|America|\bUSA?\b|
        洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|
        \b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|
        倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组
      ) ) .+ $
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/WorldMap.png
rules:
- rule_set:
    name: Jinx-CN
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-direct.list
    policy: DIRECT
    update_interval: 604800
- rule_set:
    name: Jinx-Ads
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list
    policy: AD
    update_interval: 604800
- rule_set:
    name: AWAvenue-Ads
    match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
