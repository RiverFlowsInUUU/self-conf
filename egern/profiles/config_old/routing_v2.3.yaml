# ================================================================ routing_v2.3（正式版 · 推荐）
# 本版 = **routing_v2.2 + 四处修正**，`dns` 段 / `rules` 段逐字相同。
# ⭐ 推荐版由 `routing_v2.2` 移交给本版；`routing_v2.2` 降为保留版（文件未动，留作对照）。
#
#   【修 1】MAX 的 filter 两种错法：既误收、又漏收
#       routing_v2.2 写的是 `0\.(?:01|1)` —— 只认字面 `0.01` / `0.1`，且没有左边界。
#       ⇒ **误收**：任何含 `0.1` 子串的文本都命中，如 `10.1 倍率`（尾部 `0.1`）、
#          `剩余流量：100.12 GB`（`0.12` 的前缀 `0.1`）。MAX 是 Proxy 的首项，
#          默认出口可能落到 10 倍率节点上（费钱）。
#       ⇒ **漏收**：`0.2` / `0.3` / `0.5` / `0.99` / `0.08` 这些同样 < 1 的倍率全被漏掉。
#       改为 `(?<![\d.])0\.\d*[1-9]`：**收录所有倍率 < 1 的节点**
#       （0.01 / 0.08 / 0.1 / 0.15 / 0.2 / 0.5 / 0.99 …），排除 ≥1 的和非倍率数字。
#       复验：18 个真实节点名样例，routing_v2.3 判错 0 例（routing_v2.2 判错 6 例 = 误收 1 + 漏收 5）。
#
#       ⚠️ **残留风险（未修，属已知边界）**：若订阅把「信息行」也塞成节点名，
#          `剩余流量：0.5 TB` 这类仍会被收（0.5 < 1，从倍率语义看是"对的"）。
#          真遇到时在 filter 前面再加一段负向断言（排除「剩余流量 / 套餐到期 / 官网」）即可。
#
#   【修 2】Korea 的上游含 Smart —— 这是 routing_v2.2 引入的冗余
#       routing_v2.1 里 Smart = [Airport-Free, Airport-C]，Korea 引用它还能带来 C/Free 的节点；
#       routing_v2.2 把 Smart 改成 [Airport-A, Airport-B] 之后，
#       **Smart ⊂ (Airport-A ∪ Airport-B)**，而 Korea 本来就引用了 A、B
#       ⇒ Smart 完全冗余，候选被重复展开。去掉 Smart，只留 [Airport-A, Airport-B]。
#
#   【修 3】Smart 补上 flatten: true
#       `flatten` 官方语义：「展开嵌套策略组中的所有代理节点……常配合 filter 使用」。
#       不加 flatten 时，Smart 的候选是「Airport-A 组」「Airport-B 组」两个**单位**
#       （两级选优）；加上之后候选是**全部具体节点**（一级选优）。
#       Smart 的定位是「组内多轮测速选最优」，应当是节点级 —— 故补上。
#       （routing_v2.2 的注释里写的「MAX 与 Smart 同构」是错的：MAX 有 flatten、Smart 没有。）
#
#   【修 4】ChatGPT / Gemini 是空组 ⇒ 导入即静默断流
#       两组原为 `fallback` + `policies: []`，而规则 4/5 **直接指向它们**
#       （OpenAI.list → ChatGPT、Gemini.list → Gemini），且 `Google` 组首项就是 `Gemini`。
#       空组 = 没有任何出口 ⇒ 这些分区的流量在填好之前一直是断的。
#       现填入 `Proxy` 作安全默认，并加 `flatten: true`：
#         不加 flatten ⇒ 候选是「Proxy」这一个组单位，fallback 只有 1 个候选，
#                        等于没有故障转移能力，且 Proxy 一旦不可用整组就断；
#         加 flatten   ⇒ Proxy 展开成**全部具体节点**，fallback 在节点级按顺序试第一个可用的。
#       ⇒ 组合效果 = 给 Proxy 补一层「节点级故障转移」。
#       （官方「通用字段」明确：flatten 在 select / auto_test / smart / fallback /
#         load_balance 五种基础类型上通用，fallback 用它合法。）
#
# ---- 以下为 routing_v2.2 的说明，保留以便对照 ----
# 本版 = routing_v2.1 的「机场槽位精简版」，dns 段 / 规则 / 服务组全部逐字相同。
# 只动 policy_groups 里的订阅入口，把 4 个机场槽位压到 2 个：
#   【删】Airport-C     —— 引用面只有 Smart / Japan 两个组
#   【删】Airport-Free  —— 引用面只有 Smart 一个组
#   【改】Smart         —— 上游从「Airport-Free · Airport-C」改为「Airport-A · Airport-B」
#   【改】Japan         —— 上游去掉 Airport-C，只剩「Airport-A · Airport-B」
#   【改】MAX           —— 不再自带订阅 URL，改为「带节点筛选的 Smart」。
# ⇒ 机场订阅入口 4 → 2（Airport-A / Airport-B），URL 占位符 9 → 4 条。
#    保留 A、B 的理由：A 被 8 个组引用、B 被 7 个，是地区组的共同上游；
#    C 与 Free 只服务 Smart，删掉后 Smart 仍有 A/B 可用，能力不降。
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
real_ip_domains:
# 这几个域名不做 Fake IP 映射，交给系统解析。
# Windows/Apple 的推送与内网发现走的是「隧道外」的链路（include_apns: false），
# 用 Fake IP 反而会让推送异常，所以这里必须放行。
- '*.lan'
- '*.local'
- '*.push.apple.com'
dns:
  # ================================================================ routing_v2 的唯一改动
  # routing_v2 与 routing_v1 的差别**只在这一节**，其余顶层段逐字相同。
  # routing_v1 的 dns 段是 40 行；本节压到 22 行，防泄露能力经仓库自带审计脚本实测**逐项等价**
  # （check_egern_dns.py 与 audit_dns_forward.py 结论一致，差异仅为被删端点的逐条检查项）。
  #
  # 取舍判据只有一条：
  #   **删掉某一项，会不会多出一条明文 UDP:53 的通路？**  不会 → 冗余，可删。
  #
  # 明文 UDP:53 只有 bootstrap 一条通路。官方 dns 文档逐字规定它有且只有两个用途：
  #   ① 解析 upstreams 中加密 DNS 服务器的主机名；
  #   ② 作为最终的 DNS 回退。
  # 本节的全部工作就是让这两条用途都无事可做：
  #   用途① 用「端点全写 IP 字面量」消灭；用途② 用「forward 兜底指向一个不依赖
  #   代理也活着的加密组」堵死。
  #
  # routing_v1 → routing_v2 删掉的两处，以及为什么删了也安全：
  #   【删】hosts: 整段（10 行）—— dns.alidns.com / doh.pub / dot.pub 这三个映射
  #        在本配置里**没有任何引用点**：upstreams 与 proxy_nameservers 的端点
  #        全是 IP 字面量，没有任何地方去解析这三个主机名。它的原始用途是「当你想写
  #        https://dns.alidns.com/dns-query 时，用 hosts 把这个名字钉到 IP，省掉一次
  #        bootstrap 解析」。既然直接写 IP，这层 hosts 就是装饰品。
  #   【删】forward 的第 2 条兜底 domain_regex: '.'（3 行）—— 与第 1 条
  #        domain_wildcard: '*' 语义完全重叠（任何域名两条都命中、value 又都是
  #        Domestic-DNS），按官方「第一条命中即决定上游」，第 2 条永远不会被求值。
  # 另外端点 6 → 4：删掉的只是「同机构 + 同协议」的重复项，保留「2 机构 × 2 协议」矩阵。
  # ================================================================
  # ---------------------------------------------------------------- 启动 DNS
  # 唯一无法消除的明文通路，只能「约束」它。
  # 不能删：官方规定「未配置或解析失败时，自动使用系统 DNS 服务器」，
  #         而系统 DNS = Wi-Fi/蜂窝下发的 = 运营商 DNS，比写这里更糟。
  # 不能写 system：那等于主动把运营商 DNS 接进来。
  # 为什么是 2 个：只列 1 个时审计脚本会给 LOW —— 它一旦失败就直接掉系统 DNS。
  # 为什么跨机构：阿里 + 腾讯，任一机构整体故障时还有另一个。
  bootstrap:
  - 223.5.5.5      # 阿里 AliDNS
  - 119.29.29.29   # 腾讯 DNSPod
  # ---------------------------------------------------------------- 上游 DNS 组
  # 兜底组，承接所有域名的解析。
  # 端点必须是 IP 字面量：一旦写成 https://dns.alidns.com/dns-query，软件就必须先
  # 解析这个主机名，而那次解析只能用 bootstrap（明文）—— 这就是「用途①」被激活，
  # 也正是 docs/02 的案例②。
  # 为什么保留 DoT：它是 853 端口，与 DoH 的 443 是两条独立通路，某些网络会拦其一。
  # 两个 DoT 端点的证书已实测带 IP SAN（223.5.5.5 / 1.12.12.12 均在 SAN 内），
  # 所以「IP 字面量 + 证书校验」成立，不需要 skip_tls_verify。
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query      # 阿里 · DoH
    - tls://223.5.5.5                  # 阿里 · DoT
    - https://120.53.53.53/dns-query   # 腾讯 · DoH
    - tls://1.12.12.12                 # 腾讯 · DoT
  # ---------------------------------------------------------------- 转发规则
  # 一条 catch-all 就够。官方「完整示例」的最后一条正是 domain_wildcard: '*'，
  # 这是标准兜底写法。只要它在，任何域名都不会「未命中 Forward」⇒ 默认 DNS 永不回退 bootstrap。
  forward:
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  # ---------------------------------------------------------------- 代理 DNS
  # 不建议删。作用：让「代理 DNS」这条路径跳过 Forward，直接钉死在国内加密 DNS 上。
  # 删掉会怎样：代理 DNS 改走 Forward、命中同一条 catch-all，**结果其实一样**；
  # 但结构上「代理 DNS 未命中 → 回退 bootstrap」这条分支就还在。
  # 仓库的 audit_dns_forward.py 对「未配置」会给出待确认项 —— 实测确认了这一点。
  # 端点必须与上游组一致：代理 DNS 是**强制直连**的，境外解析器在电信线路上不可达。
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - tls://223.5.5.5
  - https://120.53.53.53/dns-query
  - tls://1.12.12.12
  # ---------------------------------------------------------------- 污染应答过滤
  # 与泄露无关，是抗污染：丢弃空路由式应答（0.0.0.0 / 127.0.0.1）。
  # 刻意不放 10.0.0.0/8 等私网段，避免误伤内网域名的解析结果。
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
proxies: []
# 在此添加你的节点。本模板不附带任何示例 / 虚拟节点 —— 节点由你自行填写，
# 再把下方分流组的 policies 填上对应的节点名（或订阅组名）。
policy_groups:
- select:
    name: Proxy
    policies:
    - MAX
    - Smart
    - Hong Kong
    - USA
    - Singapore
    - Taiwan
    - Japan
    - Korea
    - Other Regions
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png
- smart:
    name: Smart
    # 【routing_v2.3 修 3】补上 flatten: true —— 与 MAX 对齐，候选变成「全部具体节点」而非「A 组 / B 组」两个单位。
    #   routing_v2.2 及更早版本这里没有 flatten（Smart 只在两个订阅组之间做二级选优）。
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Auto.png
- fallback:
    name: ChatGPT
    # 【routing_v2.3 正式版新增】原先 `policies: []` 是**空的** —— 而规则 4 直接指向本组
    #   （OpenAI.list → ChatGPT）⇒ 导入即静默断流：ChatGPT 相关域名没有任何出口。
    #   现在填 `Proxy` 作安全默认，并加 `flatten: true`。
    #
    #   为什么必须配 flatten（官方「通用字段」说明：flatten 在 select / auto_test / smart /
    #   fallback / load_balance 五种基础类型上通用）：
    #     · 不加 flatten ⇒ 候选是「Proxy」这**一个组单位**，fallback 只有 1 个候选，
    #       等于没有故障转移能力，且 Proxy 一旦不可用整组就断。
    #     · 加 flatten  ⇒ Proxy 被**展开成全部具体节点**，fallback 在节点级按顺序试第一个可用的。
    #   组合效果 = 给 Proxy 补了一层「节点级故障转移」。
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/openai.png
- fallback:
    name: Gemini
    # 【routing_v2.3 正式版新增】同 ChatGPT：原为空 `policies: []`，而规则 5 直接指向本组，
    #   且 `Google` 组的**首项就是 `Gemini`**（默认选中它）⇒ 影响面比 ChatGPT 更大。
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/gemini-color.png
- smart:
    name: Claude
    policies:
    - Taiwan
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/claude-color.png
- smart:
    name: AI
    policies:
    - Proxy
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/grok.png
- select:
    name: Spotify
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Spotify.png
- select:
    name: YouTubeMusic
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/YouTubeMusic.png
- select:
    name: YouTube
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/YouTube.png
- select:
    name: GitHub
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/GitHub.png
- select:
    name: Google
    policies:
    - Gemini
    - Proxy
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Google.png
- select:
    name: Microsoft
    policies:
    - DIRECT
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Microsoft.png
- select:
    name: Telegram
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Telegram.png
- select:
    name: Twitter
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Twitter.png
- external:
    name: Airport-A
    type: smart
    urls:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Airport.png
- external:
    name: Airport-B
    type: smart
    urls:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    urls_disabled:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Airport.png
# 【routing_v2.2 删除】Airport-C 与 Airport-Free 两个订阅槽位原本在这里。
#   Airport-C 只被 Smart / Japan 引用，Airport-Free 只被 Smart 引用；
#   两者的上游引用已并入 Airport-A / Airport-B，删掉不损失任何选路能力。
- select:
    name: WeChat
    policies:
    - DIRECT
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/WeChat.png
- select:
    name: AD
    policies:
    - REJECT
    - DIRECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/AdBlock.png
# ================================================================ 地区组（7 个）
# ⚠️ 这 6 个地区组（+ 末尾的 Other Regions）的关键词是**两份拷贝**：
#    每个地区组写自己的 filter，而 Other Regions 的负向断言把它们的全部关键词又抄了一遍。
#    **改任何一个地区组的关键词，都要同步改 Other Regions。**
#    校验：`python skill/scripts/audit_region_filters.py profiles/routing_v2.3.yaml`
# ================================================================
- smart:
    name: Hong Kong
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?i)🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/HongKong.png
- smart:
    name: USA
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?i)🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/UnitedStates.png
- smart:
    name: Japan
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?i)🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Japan.png
- smart:
    name: Taiwan
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?i)🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Taiwan.png
- smart:
    name: Singapore
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?i)🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Singapore.png
- smart:
    name: Korea
    # 【routing_v2.3 修 2】上游去掉 Smart —— routing_v2.2 起 Smart = [Airport-A, Airport-B]，
    #   是 (Airport-A ∪ Airport-B) 的子集，而下面已经直接引用了 A、B ⇒ Smart 冗余，候选会被重复展开。
    #   （routing_v2.1 及更早版本不冗余：那时 Smart = [Airport-Free, Airport-C]，能带来 C/Free 的节点。）
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?i)🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Korea.png
- smart:
    name: Other Regions
    # ================================================================ ⚠️ 维护陷阱（routing_v2.3 起标注）
    # 下面这段负向断言，把上面 6 个地区组（Hong Kong / USA / Japan / Taiwan / Singapore / Korea）
    # 的筛选关键词**逐字抄了一遍**，共 91 个。这是有意为之（负向断言要求"排除以上全部"），
    # 但代价是：**任何地区组新增/修改关键词，都必须同步改这里。**
    #
    # 漏改的后果：该关键词不再被负向断言排除 ⇒ 属于那个地区的节点会**同时**出现在
    # 它自己的地区组和 Other Regions 里，两个组的内容不再互斥。
    #
    # 自动校验：`python skill/scripts/audit_region_filters.py profiles/routing_v2.3.yaml`
    #   它会把 6 个地区组的关键词集合与下面这段负向断言逐个比对，报出缺失项。
    #   ⚠️ 这段无法靠 YAML 变量消除（Egern 不支持 filter 引用），只能靠脚本守。
    # ================================================================
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: |-
      (?xi) ^ (?! .* (?:
        🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|
        🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|
        🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|
        🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|
        🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b|
        🇺🇸|美国|United\s*States|America|\bUSA?\b|
        洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|
        \b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|
        倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组
      ) ) .+ $
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/WorldMap.png
- smart:
    name: MAX
    # 【routing_v2.3 修 1】filter 改为「收录所有倍率 < 1 的节点」。
    #   routing_v2.2 用的是 `0\.(?:01|1)` —— 只认字面 `0.01` / `0.1`，且没有左边界，两种错法：
    #     · 误收：含 `0.1` 子串的都命中，如 `10.1 倍率`、`剩余流量：100.12 GB`
    #     · 漏收：`0.2` / `0.3` / `0.5` / `0.99` / `0.08` 这些同样 < 1 的全漏掉
    #   而 MAX 是 Proxy 的首项，默认出口可能落到 10 倍率节点上（费钱）。
    #   新写法 `(?<![\d.])0\.\d*[1-9]`：
    #     · `(?<![\d.])` 保证 `0.` 前面不是数字或点 ⇒ 排除 `10.1` / `100.12` / `50.5` 的尾部
    #     · `0\.` 锁定小数形态 ⇒ 排除整数 `1x` / `2x` / `1.0x`
    #     · `\d*[1-9]` 要求至少一位非零数字 ⇒ 排除无意义的 `0.0`
    #   ⇒ 0.01 / 0.08 / 0.1 / 0.15 / 0.2 / 0.5 / 0.99 … 全部收录；1x / 1.5x / 2x / 10.1 全部排除。
    #   复验：18 个真实节点名样例，routing_v2.3 判错 0 例（routing_v2.2 判错 6 例）。
    #   ⚠️ 残留风险：若订阅把「信息行」也塞成节点名（如 `剩余流量：0.5 TB`），仍会被收
    #      （0.5 < 1，从倍率语义看是对的）。真遇到时在下方 filter 前面加一段负向断言即可。
    policies:
    - Airport-A
    - Airport-B
    flatten: true
    filter: (?<![\d.])0\.\d*[1-9]
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Nfcloud.png
- select:
    name: Final
    policies:
    - Proxy
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Final.png
rules:
# 注：原「DNS 端点固定路由」规则（alidns / doh.pub / dns.google / cloudflare-dns 及若干 DNS 服务器 IP）
# 已全部移除 —— 本模板 dns.upstreams / proxy_nameservers / bootstrap 均为 IP 字面量，解析器直接以 IP 访问，
# 无需在 rules 中钉域名/IP；移除不影响防 DNS 泄露（详见 DetailsReadme 的「配置框架逐段详解」）。
# ---- 原有规则（2026-09-21 在其之前新增了 white-guard / ads 两条；原有规则之间顺序不变）----
