# ★ f7 核心改动：Apple_All.list -> Apple_All_No_Resolve.list
#   官方 rules 文档原文：「no_resolve (bool)……设为 true 时仅匹配已解析的 IP 地址，
#   **不会触发 DNS 解析**」—— 反过来说，不带 no_resolve 的 IP 类条目**会触发解析**。
#   Apple_All.list 里有 13 条 IP-CIDR 没带 no-resolve（139.178.128.0/18 等 Apple CDN 段），
#   而这条规则排在 default 之前且 policy=DIRECT（未禁用）⇒ **每个没被前面规则命中的域名，
#   经过这里都会被强制解析一次**。这就是 dnsleaktest 里「判定是 default → Final → Proxy，
#   但 upstream 显示 bootstrap」的来源：为了判定这条 IP 规则而触发的解析走了明文。
#   No_Resolve 版与原版逐条等价（只是那 13 条补上 ,no-resolve），覆盖面无损失；
#   对 IP 形式的连接判定也完全不受影响（IP 本就无需解析）。
#   全部 20 个远程规则集已逐个下载核对：**只有 Apple_All.list 存在这个缺陷**。
- rule_set:
    name: Apple
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All_No_Resolve.list
    policy: DIRECT
- rule_set:
    name: WeChat
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list
    policy: WeChat
# ★ 国内域名直连的**主力**规则集。
#   历史（f8）：f7 给 geoip:CN 加 no_resolve 治住泄露后，国内域名整片落到 default → Final → Proxy。
#   根因不在 DNS、在**分流**：geoip 加了 no_resolve 便不再匹配域名，国内域名的直连必须由
#   一份「域名条目足够多」的国内规则集承接。f8 起用 ChinaMax_All_No_Resolve.list
#   （111,332 域名 + 同份 12,472 条带 no-resolve 的 IP）补齐——注意 ChinaMax.list 本身
#   只是 IP 规则集（12,614 条里 12,472 条是 IP、域名仅 64 条），兜不住域名。
#   现改为 Loyalsoldier `direct.txt`：共 111,160 条，**纯域名**
#   （110,607 条 DOMAIN-SUFFIX + 553 条 DOMAIN，零 IP 条目）。
#   —— 纯域名规则集只做域名串匹配、**不触发任何解析**，因此与 no_resolve 无关；
#      原先由 ChinaMax 的 IP 条目承担的「已是 IP 的连接」由下方 geoip:CN 兜住。
- rule_set:
    name: CN
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    policy: DIRECT
# .cn 直连兜底：geoip 加了 no_resolve 后无法匹配域名。上面的国内域名规则集
# 已覆盖绝大多数国内域名；这一条把整个 .cn TLD 再钉一次，不依赖规则集是否加载成功。
- domain_suffix:
    match: cn
    policy: DIRECT
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
- default:
    name: Final
    policy: Final
# ================================================================ MITM（模板已移除）
# ⚠️ 原配置这里带 `ca_p12` + `ca_passphrase` —— 那是**个人 MITM CA 的私钥**（PKCS#12）。
#    它一旦公开，任何人都能用它解密你经 MITM 的 TLS 流量并签发任意证书，
#    所以**绝对不要提交到任何仓库**。本模板整个 mitm 段已注释掉。
#    注意：本配置的防 DNS 泄露**完全不需要 MITM**（靠的是 dns 段 + no_resolve +
#    规则集筛选），需要用到 MITM 时再自行生成 CA 并在本地填写。
# mitm:
#   ca_p12: <在此填入你自己生成的 base64 PKCS#12>
#   ca_passphrase: <你的口令>

default_proxy_group: Proxy
