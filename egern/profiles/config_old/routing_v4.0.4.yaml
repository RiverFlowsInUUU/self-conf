    policy: Claude
    update_interval: 604800
# 通用 AI 兜底集（Repcz · 滚动维护）—— bm7 四条专属集在前已按家分流，这里收其余 AI 类域名。
- rule_set:
    name: AI
    match: https://raw.githubusercontent.com/Repcz/Tool/X/Surge/Rules/AI.list
    policy: AI
    update_interval: 604800
# 伴生域/宽后缀整合集（本仓自托管静态快照 · 零 IP · 条数与来源见该文件头部档案）：
# googleapis.com / googleusercontent.com 整域收编 —— play.googleapis.com 等 GMS 网关
# 与 ChatGPT 认证/遥测/风控基础设施域不再漏出 AI 组；上行 Repcz 管滚动新 AI 域。
- rule_set:
    name: AI_Domains
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/AI.list
    policy: AI
# GitHub —— 规则集仍引用（`GitHub.list`），但**不再单独成组**：本条直接指向 `Proxy`。
    update_interval: 604800
- rule_set:
