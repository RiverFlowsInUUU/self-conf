    policy: Google
    update_interval: 604800
- rule_set:
    name: Telegram
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list
    policy: Telegram
    update_interval: 604800
- rule_set:
    name: Spotify
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list
    policy: Spotify
    update_interval: 604800
- rule_set:
    name: Twitter
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list
    policy: Twitter
    update_interval: 604800
- rule_set:
    name: Microsoft
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list
    policy: Microsoft
    update_interval: 604800
- rule_set:
    name: Apple
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/apple.txt
    policy: DIRECT
    update_interval: 604800
# ★ 国内域名直连的**主力**规则集：Loyalsoldier `direct.txt` —— 纯域名集、零 IP 条目。
#   ⚠️ 条数**不写死** —— 该清单每周随上游更新，写进注释的精确数必然过期；要现值就现抓：
#   `python skill/scripts/egern/profile_ruleset.py <下面这条 rule_set 的 match 地址>`。
#   —— 纯域名规则集只做域名串匹配、**不触发任何解析**，因此与 no_resolve 无关；
#      「已是 IP 的连接」由下方 geoip:CN（带 no_resolve）兜住。
- rule_set:
    name: CN-Domains
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    policy: DIRECT
    update_interval: 604800
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
# ⑦ 兜底 —— 与懒人版同一写法：**中间不挂 `Final` 组**，`default` 的 `policy`
#     直写 `Proxy`。`name` 只是日志标签（官方：用于日志和调试），保留 `Final`
#     这个名字是为了历代日志读得通；真正决定去向的只有 `policy`。
#     （2026-10-05：原 `Final` 兜底组已删 —— 它只有一个成员 `Proxy`，
#       在面板上本就无从选择，留着无意义。）
- default:
    name: Final
    policy: Proxy
# ================================================================ MITM（模板已移除）
# ⚠️ 原配置这里带 `ca_p12` + `ca_passphrase` —— 那是**个人 MITM CA 的私钥**（PKCS#12）。
#    它一旦公开，任何人都能用它解密你经 MITM 的 TLS 流量并签发任意证书，
#    所以**绝对不要提交到任何仓库**。本模板整个 mitm 段已注释掉。
#    注意：本配置的防 DNS 泄露**完全不需要 MITM**（靠的是 dns 段 + no_resolve +
#    规则集筛选），需要用到 MITM 时再自行生成 CA 并在本地填写。
# mitm:
#   ca_p12: <在此填入你自己生成的 base64 PKCS#12>
#   ca_passphrase: <你的口令>

default_proxy_group: Proxy
