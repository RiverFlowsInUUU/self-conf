#! version=routing_v4.0.4
# ================================================================ routing（正式版 · 推荐）
# 结构（与 Surge `routing.conf` 逐行对齐，内容与顺序均对拍）：
#   ① `dns.forward` 由单条 catch-all 扩为 4 层：
#      白名单（direct → Domestic-DNS，抢在拦截前拿到解析）
#      → Jinx-Ads / AWAvenue 两条广告清单（value: reject —— 官方语义
#      "refuse the query and return an empty response"，解析阶段直接拒答，
#      等价 Surge 的 pre-matching REJECT）→ catch-all 兜底。
#      防泄露面不变：查询去向仍是 Domestic-DNS 加密组或拒答二选一，
#      proxy_nameservers 绕过 Forward、bootstrap 依旧闲置。
#   ② `rules` 补 `private.txt → DIRECT`（与 Surge 同源同策略；Lan.list 保留互补
#      —— Lan 管 IP 段与路由管理域，private 管 .lan/.local 等特殊 TLD 与 miwifi.com）。
#   ③ `rules` 删内联 `domain_suffix: cn` 兜底（direct.txt 本身已含 DOMAIN-SUFFIX,cn，
#      正常路径 100% 重复；故障场景只是退化不是泄露）。
#   ④ `rules` 顺序为本仓基准序，Surge `routing.conf` 与本文件逐行对齐
#      （仅两处引擎差异例外：Surge 独有内置 SYSTEM / 内置 LAN，Egern 用 blackmatrix7 Lan.list）。
# `policy_groups`、`dns` 其余键与 Surge 侧逐字对应。
#
#   【为什么必须显式钉】`rule_set` 缺 `update_interval` 时可能只在首次下载、之后不再刷新
#      ⇒ **规则集永远停在旧版本**，上游新收录的域名命不中。本文件全部规则集显式钉 `604800`。
#
#   【为什么不做域名白名单】给单个域名加直连（如 `domain_suffix: tuyacn.com`）是治标：
#      国内 `.com` 域名漏网是**结构性**问题（`geoip: CN` 带 `no_resolve`，只认已是 IP 的连接），
#      逐个列举既列不全、也要长期维护。本配置的做法是「让规则集保持新鲜」，对所有域名一次性生效。
#
# IPv6 显式关闭：与 Surge 内核对齐（两边都是显式关闭，行为一致）
ipv6: false
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://connect.rom.miui.com/generate_204
real_ip_domains:
# 这几个域名不做 Fake IP 映射，交给系统解析。
# Windows/Apple 的推送与内网发现走的是「隧道外」的链路（include_apns: false），
# 用 Fake IP 反而会让推送异常，所以这里必须放行。
- '*.lan'
- '*.local'
- '*.push.apple.com'
dns:
  # ================================================================ DNS 段设计
  # 取舍判据只有一条：
  #   **删掉某一项，会不会多出一条明文 UDP:53 的通路？**  不会 → 冗余，可删。
  #
  # 明文 UDP:53 只有 bootstrap 一条通路。官方 dns 文档逐字规定它有且只有两个用途：
  #   ① 解析 upstreams 中加密 DNS 服务器的主机名；
  #   ② 作为最终的 DNS 回退。
  # 本节的全部工作就是让这两条用途都无事可做：
  #   用途① 用「端点全写 IP 字面量」消灭；用途② 用「forward 兜底指向一个不依赖
  #   代理也活着的加密组」堵死。
  #
  # 本 dns 段的两条设计约束，以及它们为什么不引入明文通路：
  #   · 不设 `hosts:` —— upstreams 与 proxy_nameservers 的端点全是 IP 字面量，
  #     没有任何地方需要解析主机名，hosts 映射没有引用点。
  #   · `forward` 只保留一条 catch-all（domain_wildcard: '*'），不并列 domain_regex: '.'
  #     —— 两者语义完全重叠（任何域名都命中、value 又都是 Domestic-DNS），
  #     按官方「第一条命中即决定上游」，第二条永远不会被求值。
  # 端点 4 个 = 「2 机构 × 2 协议」矩阵（阿里 / 腾讯 × DoH / DoT），互为独立通路。
  # ================================================================
  # ---------------------------------------------------------------- 启动 DNS
  # 唯一无法消除的明文通路，只能「约束」它。
  # 不能删：官方规定「未配置或解析失败时，自动使用系统 DNS 服务器」，
  #         而系统 DNS = Wi-Fi/蜂窝下发的 = 运营商 DNS，比写这里更糟。
  # 不能写 system：那等于主动把运营商 DNS 接进来。
  # 为什么是 2 个：只列 1 个时审计脚本会给 LOW —— 它一旦失败就直接掉系统 DNS。
  # 为什么跨机构：阿里 + 腾讯，任一机构整体故障时还有另一个。
  bootstrap:
  - 223.5.5.5      # 阿里 AliDNS
  - 119.29.29.29   # 腾讯 DNSPod
  # ---------------------------------------------------------------- 上游 DNS 组
  # 兜底组，承接所有域名的解析。
  # 端点必须是 IP 字面量：一旦写成 https://dns.alidns.com/dns-query，软件就必须先
  # 解析这个主机名，而那次解析只能用 bootstrap（明文）—— 这就是「用途①」被激活，
  # 也正是 skill/reference/shared/dns-basics.md 的案例 2。
  # 为什么保留 DoT：它是 853 端口，与 DoH 的 443 是两条独立通路，某些网络会拦其一。
  # 两个 DoT 端点的证书已实测带 IP SAN（223.5.5.5 / 1.12.12.12 均在 SAN 内），
  # 所以「IP 字面量 + 证书校验」成立，不需要 skip_tls_verify。
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query      # 阿里 · DoH
    - tls://223.5.5.5                  # 阿里 · DoT
    - https://120.53.53.53/dns-query   # 腾讯 · DoH
    - tls://1.12.12.12                 # 腾讯 · DoT
  # ---------------------------------------------------------------- 转发规则
  # 三层结构，与 Surge 的 [Rule] 次序逐层对齐（first-match-wins，官方语义：
  # "Rules are evaluated in declaration order; the first matching rule routes
  #  the query to its upstream"）：
  #   ① 白名单首位：命中 → Domestic-DNS 正常加密解析。对应 Surge 的
  #      RULE-SET direct,DIRECT —— 白名单（会被广告清单误杀的功能域，
  #      条数随上游更新，不写死）
  #      （AWAvenue 命中其中若干条：jpush.cn / appcfg.v.qq.com / apd-pcdnwx* /
  #      tnc3-* 等）必须抢在 reject 之前拿到解析，否则流量层的白名单救不了
  #      一个解析都失败的域名。
  #   ② 广告拦截：对应 Surge 的 pre-matching REJECT —— 官方 value 字段：
  #      "The special value reject — refuse the query and return an empty
  #       response"。解析阶段直接拒答，连接根本不会发起。
  #   ③ catch-all 兜底：官方「完整示例」的最后一条正是 domain_wildcard: '*'。
  #      只要它在，任何域名都不会「未命中 Forward」⇒ 默认 DNS 永不回退 bootstrap。
  # 防泄露面不变：①③ 的查询去向都是 Domestic-DNS（同一个加密组，无新解析器）；
  # ② 是终止动作不是转发；proxy_nameservers 配置在，代理 DNS 完全绕过 Forward
  # （官方："Forward rules are bypassed"）⇒ 四条规则只改「谁来处置」，不改
  # 「任何一次查询去哪里解析」。
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-direct.list
      value: Domestic-DNS
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list
      value: reject
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
      value: reject
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  # ---------------------------------------------------------------- 代理 DNS
  # 不建议删。作用：让「代理 DNS」这条路径跳过 Forward，直接钉死在国内加密 DNS 上。
  # 删掉会怎样：代理 DNS 改走 Forward、命中同一条 catch-all，**结果其实一样**；
  # 但结构上「代理 DNS 未命中 → 回退 bootstrap」这条分支就还在。
  # 仓库的 audit_dns_forward.py 对「未配置」会给出待确认项 —— 实测确认了这一点。
  # 端点必须与上游组一致：代理 DNS 是**强制直连**的，境外解析器在电信线路上不可达。
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - tls://223.5.5.5
  - https://120.53.53.53/dns-query
  - tls://1.12.12.12
  # ---------------------------------------------------------------- 污染应答过滤
  # 与泄露无关，是抗污染：丢弃空路由式应答（0.0.0.0 / 127.0.0.1）。
  # 刻意不放 10.0.0.0/8 等私网段，避免误伤内网域名的解析结果。
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
# 两条占位节点：`Node-A` 归 `Proxy`（挂在成员末位，默认首项仍是 `Smart`），
# `Node-B` 是 `AI` 的默认成员。协议 / 字段与 Surge 分流版那两条 hysteria2 一一对应
# （`auth` ≙ Surge 的 `password`）。
# ⚠️ 地址是 RFC 5737 文档段（203.0.113.0/24），请替换为你的真实信息；
#    server 写成 IP 字面量 ⇒ 节点不产生"解析节点域名"这次查询。
# 这两条**不进**任何地区组 / `Smart` —— 那些组只从 `Airport` 订阅取节点。
# 要再加节点照这个格式写；名字里带上地区关键词（`HK` / `香港` …）时注意：
# 显式写在本节的节点不会被地区组的正则筛到。
proxies:
- hysteria2:
    name: Node-A
    server: 203.0.113.10
    port: 52341
    auth: REPLACE_WITH_YOUR_PASSWORD
    sni: REPLACE_WITH_YOUR_SNI
- hysteria2:
    name: Node-B
    server: 203.0.113.11
    port: 52341
    auth: REPLACE_WITH_YOUR_PASSWORD
    sni: REPLACE_WITH_YOUR_SNI
# 再往下是你的节点池与分流组；新节点要么写进上面的 `proxies`，要么来自 `Airport` 订阅。
policy_groups:
- select:
    name: Proxy
    # 成员 = 各组名，末位再挂 `Node-A`（挂末位是刻意的：首项仍是 `Smart`，
    # 默认出口没有被一条占位节点顶掉）。本组**不带** `flatten`，与 Surge 的
    # `select, Smart, …, "Node-A"` 同形。
    policies:
    - Smart
    - Hong Kong
    - Taiwan
    - Japan
    - Singapore
    - United States
    - Other Regions
    - Node-A
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png
- smart:
    name: Smart
    # 订阅入口为单一 Airport。
    #   ⚠️ `flatten: true` **必须保留**：它是 Surge `smart, include-other-group="Airport"` 的对应物
    #   （Egern 官方：「展开嵌套策略组中的所有代理节点」）。少了它，smart 的候选只剩「Airport」
    #   这**一个组单位**，测不到组内任何节点 ⇒ 「自动选优」直接退化。地区组同理。
    policies:
    - Airport
    flatten: true
    # `priorities` = 低倍率优先（系数 0.15；分数 × 系数、越小越优先）⇒ 低倍率节点比最优节点
    #   慢 6.7 倍以内（= 1 ÷ 0.15）仍胜出，超出或不可用则自动让位给池内其它节点。
    #   与 Surge 的 `policy-priority` 同值同正则。
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Auto.png
# ================================================================ 应用组（本段 12 个）
# ⚠️ 本段 12 个全部是 `select` + `flatten: true` —— 与 Surge 的 `select, include-other-group="Proxy"` 逐个等价。
#
#   Egern 的 `flatten: true`：把「Proxy」这个**组名**在求值期展开成组内**全部具体节点**
#     （官方原文：「展开嵌套策略组中的所有代理节点……而不是只显示策略组名称」）。
#   Surge 的 `include-other-group="Proxy"`：官方原文「includes the **resolved member
#     policies** from other policy groups」—— 同一语义。
#   ⇒ 两者**必须成对**。只写 `policies: [Proxy]` 却不加 `flatten`，成员就退化成
#     「Proxy」这**一个组单位**（≈ Surge 的 `select, Proxy`，要先点进去再选），
#     而不是 Surge 各应用组的「节点平铺」。本版即按此对齐。
#
#   首项 = 默认取向，逐组与 Surge 一致：ChatGPT / Gemini / AI / Spotify / YTMusic /
#   YouTube / Telegram / Twitter 默认 `Proxy`；Claude 默认 `Taiwan`；
#   Google 默认 `Gemini`；Microsoft 默认 `DIRECT`。
#   ⚠️ 本版有两处首项不是组名池：`AI` 首项是本文件的 `Node-B`（占位节点），
#     `Spotify` / `YouTube Music` 首项是 `United States`。两侧（Surge / Egern）同写。
# ================================================================
- select:
    name: ChatGPT
    # 规则 4（OpenAI.list → ChatGPT）直接指向本组 ⇒ 必须始终有出口，默认**美区**。
    policies:
    - United States
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/openai.png
- select:
    name: Gemini
    # 规则 5（Gemini.list → Gemini）直接指向本组；且 `Google` 组首项即本组。默认**美区**。
    policies:
    - United States
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/gemini-color.png
- select:
    name: Claude
    # 默认走台湾（Claude 对台湾线路较友好）；Taiwan 之后是 Proxy 的全节点池。
    policies:
    - Taiwan
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/claude-color.png
- select:
    name: AI
    # 默认走本文件的 `Node-B`（占位节点），其后才是 `Proxy` 摊平的整池节点。
    # ⇒ 只填两条节点、不导订阅时 `Proxy` / `AI` 仍有出口；只导订阅不填节点时，
    #   来面板把本组切到订阅节点即可（`Proxy` 首项是 `Smart`，不受影响）。
    policies:
    - Node-B
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/grok.png
- select:
    name: YouTube
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/YouTube.png
- select:
    name: Emby
    # 影视服务器（自用枚举 4 个域名，见本仓自托管 `rules/emby.list`）。
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Emby.png
- select:
    name: Google
    # 首项 `Gemini` ⇒「Google 走 Gemini → Proxy」。
    policies:
    - Gemini
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Google.png
- select:
    name: Telegram
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Telegram.png
- select:
    name: YouTube Music
    # 默认走 `United States`。
    policies:
    - United States
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/YouTubeMusic.png
- select:
    name: Spotify
    # 默认走 `United States`（与 `YouTube Music` 同）；Spotify 的解锁地区以美区为准。
    policies:
    - United States
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Spotify.png
- select:
    name: Twitter
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Twitter.png
# 单一订阅入口 Airport，对齐 Surge 的单个隐藏 Airport；下方 Smart 与各服务组统一引用它。
- external:
    name: Airport
    type: smart
    urls:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    urls_disabled:
    - https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    # 订阅刷新间隔（与 Surge 侧 `update-interval=86400` 对齐）。
    # ⚠️ Egern 官方未文档化该键的缺省值 ⇒ 显式写死，避免「刷新行为交给未知」
    #    （仓规见 skill/reference/shared/troubleshoot-faq.md「规则集刷新统一一周」）。
    interval: 86400
    hidden: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Airport.png
- select:
    name: Microsoft
    # 首项 `DIRECT`：微软服务直连优先（走代理反而慢）。
    policies:
    - DIRECT
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Microsoft.png

- select:
    name: AD
    policies:
    - REJECT
    - DIRECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/AdBlock.png
# ================================================================ 地区组（6 个）
# ⚠️ 每个地区组都带 `priorities`（系数 0.15 = 低倍率优先），与 `Smart` 及 Surge 侧逐字同值；
#    凡 smart 组都必须带它，要调这个口径就一起调。语义见上方 `Smart` 的注释。
# ⚠️ 这 5 个地区组（+ 末尾的 Other Regions）的关键词是**两份拷贝**：
#    每个地区组写自己的 filter，而 Other Regions 的负向断言把它们的全部关键词又抄了一遍。
#    **改任何一个地区组的关键词，都要同步改 Other Regions。**
#    校验：`python skill/scripts/egern/audit_region_filters.py egern/profiles/routing.yaml`
# ================================================================
- smart:
    name: Hong Kong
    policies:
    - Airport
    flatten: true
    filter: (?i)🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/HongKong.png
- smart:
    name: Taiwan
    policies:
    - Airport
    flatten: true
    filter: (?i)🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Taiwan.png
- smart:
    name: Japan
    policies:
    - Airport
    flatten: true
    filter: (?i)🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Japan.png
- smart:
    name: Singapore
    policies:
    - Airport
    flatten: true
    filter: (?i)🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Singapore.png
- smart:
    name: United States
    policies:
    - Airport
    flatten: true
    filter: (?i)🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/UnitedStates.png
- smart:
    name: Other Regions
    # ================================================================ ⚠️ 维护陷阱
    # 下面这段负向断言，把上面 5 个地区组（Hong Kong / Taiwan / Japan / Singapore / United States）
    # 的筛选关键词**逐字抄了一遍**，共 61 个。这是有意为之（负向断言要求"排除以上全部"），
    # 但代价是：**任何地区组新增/修改关键词，都必须同步改这里。**
    #
    # 漏改的后果：该关键词不再被负向断言排除 ⇒ 属于那个地区的节点会**同时**出现在
    # 它自己的地区组和 Other Regions 里，两个组的内容不再互斥。
    #
    # 自动校验：`python skill/scripts/egern/audit_region_filters.py egern/profiles/routing.yaml`
    #   它会把 5 个地区组的关键词集合与下面这段负向断言逐个比对，报出缺失项。
    #   ⚠️ 这段无法靠 YAML 变量消除（Egern 不支持 filter 引用），只能靠脚本守。
    # ================================================================
    policies:
    - Airport
    flatten: true
    filter: |-
      (?xi) ^ (?! .* (?:
        🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|
        🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|
        🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|
        🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|
        🇺🇸|美国|United\s*States|America|\bUSA?\b|
        洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|
        \b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|
        倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组
      ) ) .+ $
    priorities:
      "(?<![\\d.])0\\.\\d*[1-9]": 0.15
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/WorldMap.png
rules:
# ---- 3e. 禁用条目（与 Surge 对齐）------------------------------------------
# blackmatrix7 Proxy.list：改成**纯注释** = 不进 rules 数组、不占一位。
# Egern 虽然有 `disabled: true`，但那条仍然算数组里的一个元素 ⇒ 会比 Surge 多占一位、
# 把位 ⑲ 错开。Surge 的 `RULE-SET` 根本没有 disabled 字段（只认 no-resolve /
# extended-matching / update-interval / pre-matching），想不生效只能注释。
# 两边统一用注释写法，`skill/reference/shared/rulesets.md` §3 的「24 条逐位对齐」才成立。
#   # - rule_set:
#   #     name: Proxy
#   #     match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list
#   #     policy: Proxy
#   #     update_interval: 604800
#   #     disabled: true
# 位 ⑲ —— 对齐 Surge 内置的 `SYSTEM`：Egern 没有内置系统集，这里引用本仓自托管的时点快照
#   （内容 = Surge 官方内置 `SYSTEM` 在 2026-09-24 的清单，删掉 Egern 不支持的两条
#   `PROCESS-NAME`）。⚠️ 本仓自己维护 ⇒ 没有第三方刷新审计，Surge 大版本更新时人工比对一次。
#   与下面那条 `apple.txt` 只重叠 9 条，重复无害（两条同为 DIRECT）；它独有 9 条 ——
#   captive.apple.com / api.smoot.apple.com / api.smoot.apple.cn / .ls.apple.com /
#   .push.apple.com / .push-apple.com.akadns.net / .ess.apple.com /
#   .lcdn-locator.apple.com / .lcdn-registration.apple.com —— 是 Apple 的激活 / 推送 /
#   定位基础主机，**只有 SYSTEM 接得住**（`direct.txt` 仅兜住其中的 api.smoot.apple.cn）。
- rule_set:
    name: System
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/apple_system.list
    policy: DIRECT
    update_interval: 604800
# ★ Apple 规则集用 Loyalsoldier `apple.txt`（纯域名集，只含「在中国大陆可直连」的域）。
#   不用 Apple 全量集（`Apple_All_No_Resolve.list`）的两个理由：
#     ① 全量集含 13 条 IP-CIDR（在 no_resolve 语义下对域名请求不参与匹配）+ 23 条
#        USER-AGENT（无 MITM 时 HTTPS 无效）+ 13 条 PROCESS-NAME（仅 Surge Mac 生效）
#        —— 这些条目对 iOS 是死重量；
#     ② 它把解析到境外的 Apple 域也强制直连（developer.apple.com、国际版 iCloud 端点、
#        apple-cloudkit.com），国内反而更慢。
#   `apple.txt` 与 `direct.txt` **同仓库、同 release、同格式**，刷新口径一致；零 IP
#   ⇒ 按原则 4b **不写 `no_resolve`**。

# 注：本模板 dns.upstreams / proxy_nameservers / bootstrap 均为 IP 字面量，解析器直接以 IP 访问，
# 因此 rules 中不需要（也没有）钉 DNS 端点域名 / IP 的规则 —— 防 DNS 泄露不依赖它
# （详见 skill/reference/egern/profile-anatomy.md 的「配置框架逐段详解」）。
# ---- 规则段（与 Surge `routing.conf` 同一基准序）----
- rule_set:
    name: Jinx-CN
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-direct.list
    policy: DIRECT
    update_interval: 604800
- rule_set:
