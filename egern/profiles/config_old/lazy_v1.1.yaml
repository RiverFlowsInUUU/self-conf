#! version=lazy_v1.1
# ============================================================================
# lazy · 懒人版
#
# 只保留 3 个策略组（Proxy / AI / AD）与 6 类规则
# （白名单 / 广告拦截 / 内网直连 / 国内直连 / AI 分流 / 兜底）。
# 全部流量走一个出口。
#
# ⚠️ 它与「分流版」routing_v3.2 的关系：**不是"精简"，是"裁剪"**
#     砍的是功能本身（地区组、订阅组、各类 App 分组及其规则全部移除）。
#     保留部分的防泄露结构与分流版**同构**：dns 段去掉行尾注释后与 routing_v3.2 逐字相同
#     （四层 Forward · bootstrap / upstreams / proxy_nameservers / block_ips 全部一致），
#     规则段同样带 Lan + Private 两条内网。
#
# 📌 2026-09-23：把分流版 v3 引入的三项同步进来 —— ① `dns.forward` 由单条 catch-all
#     扩为四层（白名单 → 两条广告清单 reject → 兜底），② `rules` 补 `Private`（private.txt），
#     ③ `AI` 组补 `flatten: true`。
#     此前懒人版停在 v2.4 口径：广告域名在解析阶段照样发查询（只在连接层被拦），
#     内网只有 Lan.list 一条，AI 组把 Proxy 整组当单个成员打分。
#
# 📌 2026-09-23 同日第二轮：兜底组 `Final` **整块移除**，`default.policy` 直接写 `Proxy`
#     —— 与 Surge 懒人版的 `FINAL,Proxy,dns-failed` 拉平（两边都是「兜底 → Proxy」一跳）。
#     依据 Egern 官方文档：规则 `policy` 字段可填**内置策略 / 代理服务器名 / 策略组名**，
#     内置策略只有 `DIRECT` 与 `REJECT` 两个 —— **`Final` 不是关键字**，它一直只是组名，
#     所以这一层组纯属可选，删掉它不改变任何流量的去向。
#     分流版（routing_v1 ~ v3.2）**保留** `Final` 组且不隐藏：那里它有真实作用
#     （面板上可把兜底切到某个地区组 / 订阅组），与懒人版的前提不同。
#
# 📌 本文件**没有版本号**，是长期沿用的「懒人版」入口。
#     routing_v1 ~ routing_v2.4 是另一条线 —— 「分流版」（按应用 + 按地区），
#     历代版本各自保留以备对照，演变过程见 docs/07-文件版本沿革.md。
#
# ⚠️ 导入前必读：`Proxy` 组的 policies 是空的 `[]`。
#     routing_v2.4 里它列着 MAX / Smart / Hong Kong / USA … 这些组，本配置全部移除了，
#     所以这里必须由你填上自己的节点名（或订阅组名）。
#     在填好之前，兜底那一跳（`Proxy` 组本身）是断的 —— 也就是**所有走代理的流量都不通**。
# ============================================================================
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
real_ip_domains:
- '*.lan'
- '*.local'
- '*.push.apple.com'
# ============================================================================
# dns 段 —— 去掉行尾注释后与 routing_v3.2 逐字相同（防泄露结构完整保留）
#
# 判据：删掉某一项，会不会多出一条明文 UDP:53 的通路？不会 → 冗余。
# 明文通路只有 bootstrap 一条，官方规定它只有两个用途：① 解析 upstreams 中
# 加密 DNS 的主机名；② 作为最终回退。本段让两者都无事可做：
#   ① 端点全写 IP 字面量 ⇒ 没有主机名需要解析；
#   ② forward 有一条 catch-all 兜底，且兜底组不依赖代理也活着 ⇒ 永不触发。
#      它前面还有三层（白名单 → 两条广告清单 reject），都不新增解析器。
# 完整推导见 docs/04-模板逐段讲解.md §2。
# ============================================================================
dns:
  # 启动 DNS：唯一无法消除的明文通路，只能约束它。
  # 不能删（不写会退到「系统 DNS」= 运营商），也绝不能写 system。
  # 2 个端点、跨机构：任一机构故障时还有另一个。
  bootstrap:
  - 223.5.5.5      # 阿里 AliDNS
  - 119.29.29.29   # 腾讯 DNSPod
  # 上游组：端点必须是 IP 字面量，否则就得先解析它的主机名（那只能用 bootstrap 明文）。
  # 2 机构 × 2 协议（DoH 443 / DoT 853）是两条独立通路，某些网络会拦其一。
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query
    - tls://223.5.5.5
    - https://120.53.53.53/dns-query
    - tls://1.12.12.12
  # 四层 Forward（与分流版 routing_v3 起同构，first-match-wins）：
  #   ① 白名单 → Domestic-DNS：广告清单会误杀的那些功能域，必须抢在拒答之前拿到解析，
  #      否则流量层的白名单救不了一个解析都失败的域名。
  #   ②③ 两条广告清单 → reject：官方语义「refuse the query and return an empty
  #      response」—— 解析阶段直接拒答，连接根本不发起，等价 Surge 的 pre-matching REJECT。
  #   ④ catch-all 兜底：任何域名都不会「未命中 Forward」⇒ 永不回退 bootstrap。
  # 防泄露面不变：①④ 的去向都是 Domestic-DNS（同一个加密组，无新解析器），
  # ②③ 是终止动作不是转发；proxy_nameservers 配置在，代理 DNS 完全绕过 Forward。
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-white-guard.list
      value: Domestic-DNS
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list
      value: reject
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
      value: reject
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  # 代理 DNS 显式钉住（跳过 Forward）。删掉它功能上等价，但结构上
  # 「代理 DNS 未命中 → bootstrap」这条分支就还在。
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - tls://223.5.5.5
  - https://120.53.53.53/dns-query
  - tls://1.12.12.12
  # 抗污染：丢弃空路由式应答。
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
# ============================================================================
# 节点：留空，由你填写
# ============================================================================
proxies: []
# ============================================================================
# 策略组：只留 3 个
# ============================================================================
policy_groups:
# 手动选路入口。⚠️ policies 为空，必须填上你自己的节点名（或订阅组名），
# 否则兜底 → Proxy 是断的。
- select:
    name: Proxy
    policies: []
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png
# AI 流量出口。routing_v2.4 里还并列着 ChatGPT / Gemini / Claude 三个独立组，
# 本配置只保留这一个总入口，它们全部并入此处。
# flatten: true —— 把 Proxy 的**成员**摊进本组逐个打分，而不是把 Proxy 整组当一个成员；
# 分流版自 v3 起就这么写，懒人版 2026-09-23 跟上。
- smart:
    name: AI
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/openai.png
# 广告拦截。只有一个子策略：REJECT（拦截）。
# 本配置不再提供 DIRECT 兜底 —— 想临时放行某个广告域名，在 rules 里加一条更靠前的
# domain / domain_suffix 规则指向 DIRECT 即可（别整组切走，那等于关掉全部拦截）。
- select:
    name: AD
    policies:
    - REJECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/AdBlock.png
# ============================================================================
# 规则：顺序就是一切（自上而下第一条命中即决定去向）
#   ① 白名单   ② 广告拦截   ③ 内网直连   ④ Apple 系统服务
#   ⑤ AI 分流  ⑥ 直连集合（国内域名 / geoip CN）   ⑦ 兜底
# ============================================================================
rules:
# ① 白名单 —— **必须放最前面**：这些域名要抢在广告规则之前放行，
#    否则会被下面的广告规则误杀。（43 条：41 条 DOMAIN 精确匹配 + 2 条 DOMAIN-SUFFIX）
- rule_set:
    name: Jinx-CN
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-white-guard.list
    policy: DIRECT
    update_interval: 604800
# ② 广告拦截 —— 两条并列（先 Jinx，后 AWAvenue），都指向 AD。
- rule_set:
    name: Jinx-Ads
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list
    policy: AD
    update_interval: 604800
- rule_set:
    name: AWAvenue-Ads
    match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
    policy: AD
    update_interval: 604800
# ③ 内网 / 局域网 —— 必须直连。两条互补（与 Surge 懒人版的 LAN + private.txt 同源同策略）：
#    Lan.list 管 IP 段与路由管理域，private.txt 管 .lan / .local 等特殊 TLD 与 miwifi.com。
- rule_set:
    name: Lan
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list
    policy: DIRECT
    update_interval: 604800
- rule_set:
    name: Private
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/private.txt
    policy: DIRECT
    update_interval: 604800
# ④ Apple 系统服务直连 —— 对齐 Surge 懒人版的内置 `SYSTEM`。Egern 没有内置系统集，
#    这里引用本仓自托管的时点快照：内容 = Surge 官方内置 `SYSTEM` 在 2026-09-24 的清单，
#    删掉了 Egern 不支持的两条 `PROCESS-NAME`（`trustd` / `netbiosd`）。
#    ⚠️ 本仓自己维护 ⇒ 没有第三方刷新审计，Surge 大版本更新时人工比对一次。
#    18 条里 10 条下面的 `CN`(direct.txt) 已经接住，另 8 条是它独有的增量（APNs 推送 /
#    定位 / CDN 定位那几类）；重复无害 —— 两条规则同为 DIRECT。
- rule_set:
    name: System
    match: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/egern/apple_system.list
    policy: DIRECT
    update_interval: 604800
# ⑤ AI 分流 —— 命中即走 AI 组（→ Proxy）。
- rule_set:
    name: AI
    match: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/75f0101039d71724b6e998b34604c2e053580e0c/Clash/Ruleset/AI.list
    policy: AI
    update_interval: 604800
# ⑥ 直连集合 —— 以下 2 条共同承担「国内流量直连」。
#    ⚠️ routing_v1 ~ routing_v2.4 在这里还有一条 Apple_All_No_Resolve.list（Apple 全域名直连），
#    本配置已移除 —— Apple 流量变成「部分直连、部分走代理」，详见文件末尾第 3 条。
#    （2026-09-24 ④ 位补了 System 快照，系统级主机那部分恢复直连；全量 Apple 集仍未引用。）
#    Loyalsoldier direct.txt：11 万条纯域名，是国内直连的主承重墙。
- rule_set:
    name: CN
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    policy: DIRECT
    update_interval: 604800
#    （原先这里还有一条 `domain_suffix: cn`，2026-09-24 删：`direct.txt` 本身含
#     `DOMAIN-SUFFIX,cn`（实测在该清单第 23,829 行），它接不住的那部分正是规则集覆盖
#     缺口 —— 留着反而会把缺口掩盖成「cn 域名直连正常」。分流版 v3 删它是同一条理由。）
#    geoip CN 是 IP 类规则，**必须带 no_resolve** —— 否则每个走到它的域名
#    都会被强制本地解析一次，那正是泄露来源。
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
# ⑦ 兜底 —— 所有未命中规则的流量直接走 `Proxy`（不再有 `Final` 中间组，
#     与 Surge 懒人版 `FINAL,Proxy,dns-failed` 一跳对一跳）。
#     `name` 只是日志标签（官方：用于日志和调试），保留 `Final` 这个名字
#     是为了历代日志读得通；真正决定去向的只有 `policy`。
- default:
    name: Final
    policy: Proxy
default_proxy_group: Proxy
# ----------------------------------------------------------------------------
# 相对 routing_v2.4 移除了什么（需要时从 routing_v2.4.yaml 抄回）
#
# ⚠️ 本清单以 **routing_v2.4** 为基准，读的时候要记得懒人版现已同步分流版 v3 的三项：
#    `dns.forward` 四层（见 dns 段）、`Private` 规则集、`AI` 组的 `flatten: true` ——
#    这三项**都不在**下面的清单里，它们是懒人版本轮**新增**的，不是从分流版砍下来的。
#
# 策略组（26 个）：
#   Smart、ChatGPT、Gemini、Claude、Spotify、YouTubeMusic、YouTube、GitHub、
#   Google、Microsoft、Telegram、Twitter、Airport-A/B/C/Free、WeChat、
#   Hong Kong、USA、Japan、Taiwan、Singapore、Korea、Other Regions、MAX
#   + Final —— v2.4 里它是「select: [Proxy]」的兜底组，本配置 2026-09-23 起不再要这一层
#     （rules ⑥ 的 policy 直写 Proxy）。需要面板上随时切兜底，就照 v2.4 抄回这个组
#     并把 ⑥ 的 policy 改回 Final。
# 规则（14 条）：
#   ChatGPT / Gemini / Anthropic / Claude / Spotify / YouTubeMusic / YouTube /
#   GitHub / Google / Microsoft / Telegram / Twitter / WeChat
#   （另有一条 disabled 的 Proxy.list，routing_v2.4 里本来就是关的）
#   + Apple_All_No_Resolve.list —— 这条 routing_v1 ~ routing_v2.4 都有，本配置额外删掉
#
# ⚠️ 三点后果，导入前想清楚：
#   1. `Proxy` 的 policies 现在是空的 —— 必须填节点，否则代理流量全断。
#   2. 移除 WeChat 组后，微信流量改由 geoip CN / direct.txt 兜住，仍然直连；
#      但如果你有特殊需求（例如需要走代理的微信场景），要自己加回来。
#   3. 移除 Apple_All_No_Resolve 后，Apple 流量变成「一部分直连、一部分走代理」。
#      实测依据（direct.txt 约 11.1 万条纯域名、零 IP 条目；精确条数一律现抓 ——
#      清单每周随上游变，别照抄本行）：
#      · **走代理**：icloud.com 及全部 iCloud 子域（gateway / setup / p01-* 等）、
#        apple.com 裸域、appstore.com。
#        （push.apple.com 原本也在这里 —— 2026-09-24 起由 ④ 的 System 快照接回直连。）
#        ⚠️ iCloud 系在 direct.txt 里**一条都没有** —— 这是影响最大的部分。
#        ⚠️ push.apple.com 在 real_ip_domains 里那层只是「DNS 返回真实 IP、不做 fake-ip」，
#           本来不改变去向（代理）；现在改直连是因为 ④ 那条规则，不是因为 real_ip_domains。
#      · **仍直连**：direct.txt 里那批 Apple 精确条目（2026-09-25 现抓 229 条 `DOMAIN`
#        精确匹配；从前这里写 257 条，已随上游漂 ⇒ 条数一律现抓）—— www.apple.com /
#        mesu.apple.com / swcdn.apple.com / gs-loc.apple.com /
#        amp-api.apps.apple.com / *.mzstatic.com 等（**全是 DOMAIN 精确匹配**，
#        没有 apple.com / icloud.com 的后缀条目）；
#        以及所有 .cn 域名（domain_suffix: cn 兜住，含 apple.com.cn / icloud.com.cn）。
#      结论：iCloud 同步 / 备份 / 网页版会走节点，速度取决于节点质量。
# ----------------------------------------------------------------------------
