#! version=routing_v3.3
# ================================================================ routing_v3.3（正式版 · 推荐）
# 本版 = **routing_v2.4 + 规则段对齐 Surge**（内容与顺序均逐行对拍）：
#   ① `dns.forward` 由单条 catch-all 扩为 4 层：
#      白名单（white-guard → Domestic-DNS，抢在拦截前拿到解析）
#      → Jinx-Ads / AWAvenue 两条广告清单（value: reject —— 官方语义
#      "refuse the query and return an empty response"，解析阶段直接拒答，
#      等价 Surge 的 pre-matching REJECT）→ catch-all 兜底。
#      防泄露面不变：查询去向仍是 Domestic-DNS 加密组或拒答二选一，
#      proxy_nameservers 绕过 Forward、bootstrap 依旧闲置。
#   ② `rules` 补 `private.txt → DIRECT`（与 Surge 同源同策略；Lan.list 保留互补
#      —— Lan 管 IP 段与路由管理域，private 管 .lan/.local 等特殊 TLD 与 miwifi.com）。
#   ③ `rules` 删内联 `domain_suffix: cn` 兜底（direct.txt 本身已含 DOMAIN-SUFFIX,cn，
#      正常路径 100% 重复；故障场景只是退化不是泄露）。
#   ④ `rules` 顺序为本仓基准序，Surge `routing_v3.3.conf` 与本文件逐行对齐
#      （仅两处引擎差异例外：Surge 独有内置 SYSTEM / 内置 LAN，Egern 用 blackmatrix7 Lan.list）。
# `policy_groups`、`dns` 其余键逐字未动。
# ⭐ 推荐版由 `routing_v2.4` 移交给本版；`routing_v2.4` 降为保留版（文件未动，留作对照）。
#
#   【为什么补】lazy / routing_v1 / routing_v2–routing_v2.3 **所有版本**的 `rule_set` 都缺这个字段（实测 21 条里 0 条有）。
#      官方 `rule_set` 示例带 `update_interval: 86400`；缺省时规则集可能只在首次下载、
#      之后不再刷新 ⇒ **规则集永远停在旧版本**。
#      **实测症状（2026-09-21）**：`tuyacn.com` 明明在 `direct.txt` 里（第 90494 行，
#      格式正常），却命不中；而同一列表里更老的域名能命中 —— 典型的新条目缺失。
#      补上后规则集按天刷新，新收录的域名才能生效。
#
#   【为什么不做域名白名单】给单个域名加直连（如 `domain_suffix: tuyacn.com`）是治标：
#      国内 `.com` 域名漏网是**结构性**问题（`geoip: CN` 带 `no_resolve`，只认已是 IP 的连接），
#      逐个列举既列不全、也要长期维护。本版改的是「让规则集保持新鲜」，对所有域名一次性生效。
#
# ---- 以下为 routing_v2.3 的说明，保留以便对照 ----
# 本版 = **routing_v2.2 + 四处修正**，`dns` 段 / `rules` 段逐字相同。
# ⭐ 推荐版由 `routing_v2.2` 移交给本版；`routing_v2.2` 降为保留版（文件未动，留作对照）。
#
#   【修 1】MAX 的 filter 两种错法：既误收、又漏收
#       routing_v2.2 写的是 `0\.(?:01|1)` —— 只认字面 `0.01` / `0.1`，且没有左边界。
#       ⇒ **误收**：任何含 `0.1` 子串的文本都命中，如 `10.1 倍率`（尾部 `0.1`）、
#          `剩余流量：100.12 GB`（`0.12` 的前缀 `0.1`）。MAX 是 Proxy 的首项，
#          默认出口可能落到 10 倍率节点上（费钱）。
#       ⇒ **漏收**：`0.2` / `0.3` / `0.5` / `0.99` / `0.08` 这些同样 < 1 的倍率全被漏掉。
#       改为 `(?<![\d.])0\.\d*[1-9]`：**收录所有倍率 < 1 的节点**
#       （0.01 / 0.08 / 0.1 / 0.15 / 0.2 / 0.5 / 0.99 …），排除 ≥1 的和非倍率数字。
#       复验：18 个真实节点名样例，routing_v2.3 判错 0 例（routing_v2.2 判错 6 例 = 误收 1 + 漏收 5）。
#
#       ⚠️ **残留风险（未修，属已知边界）**：若订阅把「信息行」也塞成节点名，
#          `剩余流量：0.5 TB` 这类仍会被收（0.5 < 1，从倍率语义看是"对的"）。
#          真遇到时在 filter 前面再加一段负向断言（排除「剩余流量 / 套餐到期 / 官网」）即可。
#
#   【修 2】Korea 的上游含 Smart —— 这是 routing_v2.2 引入的冗余
#       routing_v2.1 里 Smart = [Airport-Free, Airport-C]，Korea 引用它还能带来 C/Free 的节点；
#       routing_v2.2 把 Smart 改成 [Airport-A, Airport-B] 之后，
#       **Smart ⊂ (Airport-A ∪ Airport-B)**，而 Korea 本来就引用了 A、B
#       ⇒ Smart 完全冗余，候选被重复展开。去掉 Smart，只留 [Airport-A, Airport-B]。
#
#   【修 3】Smart 补上 flatten: true
#       `flatten` 官方语义：「展开嵌套策略组中的所有代理节点……常配合 filter 使用」。
#       不加 flatten 时，Smart 的候选是「Airport-A 组」「Airport-B 组」两个**单位**
#       （两级选优）；加上之后候选是**全部具体节点**（一级选优）。
#       Smart 的定位是「组内多轮测速选最优」，应当是节点级 —— 故补上。
#       （routing_v2.2 的注释里写的「MAX 与 Smart 同构」是错的：MAX 有 flatten、Smart 没有。）
#
#   【修 4】ChatGPT / Gemini 是空组 ⇒ 导入即静默断流
#       两组原为 `fallback` + `policies: []`，而规则 4/5 **直接指向它们**
#       （OpenAI.list → ChatGPT、Gemini.list → Gemini），且 `Google` 组首项就是 `Gemini`。
#       空组 = 没有任何出口 ⇒ 这些分区的流量在填好之前一直是断的。
#       现填入 `Proxy` 作安全默认，并加 `flatten: true`：
#         不加 flatten ⇒ 候选是「Proxy」这一个组单位，fallback 只有 1 个候选，
#                        等于没有故障转移能力，且 Proxy 一旦不可用整组就断；
#         加 flatten   ⇒ Proxy 展开成**全部具体节点**，fallback 在节点级按顺序试第一个可用的。
#       ⇒ 组合效果 = 给 Proxy 补一层「节点级故障转移」。
#       （官方「通用字段」明确：flatten 在 select / auto_test / smart / fallback /
#         load_balance 五种基础类型上通用，fallback 用它合法。）
#
# ---- 以下为 routing_v2.2 的说明，保留以便对照 ----
# 本版 = routing_v2.1 的「机场槽位精简版」，dns 段 / 规则 / 服务组全部逐字相同。
# 只动 policy_groups 里的订阅入口，把 4 个机场槽位压到 2 个：
#   【删】Airport-C     —— 引用面只有 Smart / Japan 两个组
#   【删】Airport-Free  —— 引用面只有 Smart 一个组
#   【改】Smart         —— 上游从「Airport-Free · Airport-C」改为「Airport-A · Airport-B」
#   【改】Japan         —— 上游去掉 Airport-C，只剩「Airport-A · Airport-B」
#   【改】MAX           —— 不再自带订阅 URL，改为「带节点筛选的 Smart」。
# ⇒ 机场订阅入口 4 → 2（Airport-A / Airport-B），URL 占位符 9 → 4 条。
#    保留 A、B 的理由：A 被 8 个组引用、B 被 7 个，是地区组的共同上游；
#    C 与 Free 只服务 Smart，删掉后 Smart 仍有 A/B 可用，能力不降。
vif_only: true
hijack_dns:
- '*'
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204
real_ip_domains:
# 这几个域名不做 Fake IP 映射，交给系统解析。
# Windows/Apple 的推送与内网发现走的是「隧道外」的链路（include_apns: false），
# 用 Fake IP 反而会让推送异常，所以这里必须放行。
- '*.lan'
- '*.local'
- '*.push.apple.com'
dns:
  # ================================================================ routing_v2 的唯一改动
  # routing_v2 与 routing_v1 的差别**只在这一节**，其余顶层段逐字相同。
  # routing_v1 的 dns 段是 40 行；本节压到 22 行，防泄露能力经仓库自带审计脚本实测**逐项等价**
  # （check_egern_dns.py 与 audit_dns_forward.py 结论一致，差异仅为被删端点的逐条检查项）。
  #
  # 取舍判据只有一条：
  #   **删掉某一项，会不会多出一条明文 UDP:53 的通路？**  不会 → 冗余，可删。
  #
  # 明文 UDP:53 只有 bootstrap 一条通路。官方 dns 文档逐字规定它有且只有两个用途：
  #   ① 解析 upstreams 中加密 DNS 服务器的主机名；
  #   ② 作为最终的 DNS 回退。
  # 本节的全部工作就是让这两条用途都无事可做：
  #   用途① 用「端点全写 IP 字面量」消灭；用途② 用「forward 兜底指向一个不依赖
  #   代理也活着的加密组」堵死。
  #
  # routing_v1 → routing_v2 删掉的两处，以及为什么删了也安全：
  #   【删】hosts: 整段（10 行）—— dns.alidns.com / doh.pub / dot.pub 这三个映射
  #        在本配置里**没有任何引用点**：upstreams 与 proxy_nameservers 的端点
  #        全是 IP 字面量，没有任何地方去解析这三个主机名。它的原始用途是「当你想写
  #        https://dns.alidns.com/dns-query 时，用 hosts 把这个名字钉到 IP，省掉一次
  #        bootstrap 解析」。既然直接写 IP，这层 hosts 就是装饰品。
  #   【删】forward 的第 2 条兜底 domain_regex: '.'（3 行）—— 与第 1 条
  #        domain_wildcard: '*' 语义完全重叠（任何域名两条都命中、value 又都是
  #        Domestic-DNS），按官方「第一条命中即决定上游」，第 2 条永远不会被求值。
  # 另外端点 6 → 4：删掉的只是「同机构 + 同协议」的重复项，保留「2 机构 × 2 协议」矩阵。
  # ================================================================
  # ---------------------------------------------------------------- 启动 DNS
  # 唯一无法消除的明文通路，只能「约束」它。
  # 不能删：官方规定「未配置或解析失败时，自动使用系统 DNS 服务器」，
  #         而系统 DNS = Wi-Fi/蜂窝下发的 = 运营商 DNS，比写这里更糟。
  # 不能写 system：那等于主动把运营商 DNS 接进来。
  # 为什么是 2 个：只列 1 个时审计脚本会给 LOW —— 它一旦失败就直接掉系统 DNS。
  # 为什么跨机构：阿里 + 腾讯，任一机构整体故障时还有另一个。
  bootstrap:
  - 223.5.5.5      # 阿里 AliDNS
  - 119.29.29.29   # 腾讯 DNSPod
  # ---------------------------------------------------------------- 上游 DNS 组
  # 兜底组，承接所有域名的解析。
  # 端点必须是 IP 字面量：一旦写成 https://dns.alidns.com/dns-query，软件就必须先
  # 解析这个主机名，而那次解析只能用 bootstrap（明文）—— 这就是「用途①」被激活，
  # 也正是 docs/02 的案例②。
  # 为什么保留 DoT：它是 853 端口，与 DoH 的 443 是两条独立通路，某些网络会拦其一。
  # 两个 DoT 端点的证书已实测带 IP SAN（223.5.5.5 / 1.12.12.12 均在 SAN 内），
  # 所以「IP 字面量 + 证书校验」成立，不需要 skip_tls_verify。
  upstreams:
    Domestic-DNS:
    - https://223.5.5.5/dns-query      # 阿里 · DoH
    - tls://223.5.5.5                  # 阿里 · DoT
    - https://120.53.53.53/dns-query   # 腾讯 · DoH
    - tls://1.12.12.12                 # 腾讯 · DoT
  # ---------------------------------------------------------------- 转发规则
  # 三层结构，与 Surge 的 [Rule] 次序逐层对齐（first-match-wins，官方语义：
  # "Rules are evaluated in declaration order; the first matching rule routes
  #  the query to its upstream"）：
  #   ① 白名单首位：命中 → Domestic-DNS 正常加密解析。对应 Surge 的
  #      RULE-SET white-guard,DIRECT —— 43 条会被广告清单误杀的功能域
  #      （AWAvenue 命中其中 10 条：jpush.cn / appcfg.v.qq.com / apd-pcdnwx* /
  #      tnc3-* 等）必须抢在 reject 之前拿到解析，否则流量层的白名单救不了
  #      一个解析都失败的域名。
  #   ② 广告拦截：对应 Surge 的 pre-matching REJECT —— 官方 value 字段：
  #      "The special value reject — refuse the query and return an empty
  #       response"。解析阶段直接拒答，连接根本不会发起。
  #   ③ catch-all 兜底：官方「完整示例」的最后一条正是 domain_wildcard: '*'。
  #      只要它在，任何域名都不会「未命中 Forward」⇒ 默认 DNS 永不回退 bootstrap。
  # 防泄露面不变：①③ 的查询去向都是 Domestic-DNS（同一个加密组，无新解析器）；
  # ② 是终止动作不是转发；proxy_nameservers 配置在，代理 DNS 完全绕过 Forward
  # （官方："Forward rules are bypassed"）⇒ 四条规则只改「谁来处置」，不改
  # 「任何一次查询去哪里解析」。
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-white-guard.list
      value: Domestic-DNS
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list
      value: reject
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list
      value: reject
  - domain_wildcard:
      match: '*'
      value: Domestic-DNS
  # ---------------------------------------------------------------- 代理 DNS
  # 不建议删。作用：让「代理 DNS」这条路径跳过 Forward，直接钉死在国内加密 DNS 上。
  # 删掉会怎样：代理 DNS 改走 Forward、命中同一条 catch-all，**结果其实一样**；
  # 但结构上「代理 DNS 未命中 → 回退 bootstrap」这条分支就还在。
  # 仓库的 audit_dns_forward.py 对「未配置」会给出待确认项 —— 实测确认了这一点。
  # 端点必须与上游组一致：代理 DNS 是**强制直连**的，境外解析器在电信线路上不可达。
  proxy_nameservers:
  - https://223.5.5.5/dns-query
  - tls://223.5.5.5
  - https://120.53.53.53/dns-query
  - tls://1.12.12.12
  # ---------------------------------------------------------------- 污染应答过滤
  # 与泄露无关，是抗污染：丢弃空路由式应答（0.0.0.0 / 127.0.0.1）。
  # 刻意不放 10.0.0.0/8 等私网段，避免误伤内网域名的解析结果。
  block_ips:
  - 0.0.0.0
  - 127.0.0.1
# 两条占位节点：`Node-A` 归 `Proxy`（挂在成员末位，默认首项仍是 `MAX`），
# `Node-B` 是 `AI` 的默认成员。协议 / 字段与 Surge 分流版那两条 hysteria2 一一对应
# （`auth` ≙ Surge 的 `password`）。
# ⚠️ 地址是 RFC 5737 文档段（203.0.113.0/24），请替换为你的真实信息；
#    server 写成 IP 字面量 ⇒ 节点不产生"解析节点域名"这次查询。
# 这两条**不进**任何地区组 / `Smart` / `MAX` —— 那些组只从 `Airport` 订阅取节点。
# 要再加节点照这个格式写；名字里带上地区关键词（`HK` / `香港` …）时注意：
# 显式写在本节的节点不会被地区组的正则筛到。
proxies:
- hysteria2:
    name: Node-A
    server: 203.0.113.10
    port: 52341
    auth: REPLACE_WITH_YOUR_PASSWORD
    sni: REPLACE_WITH_YOUR_SNI
- hysteria2:
    name: Node-B
    server: 203.0.113.11
    port: 52341
    auth: REPLACE_WITH_YOUR_PASSWORD
    sni: REPLACE_WITH_YOUR_SNI
# 再往下是你的节点池与分流组；新节点要么写进上面的 `proxies`，要么来自 `Airport` 订阅。
policy_groups:
- select:
    name: Proxy
    # 成员 = 各组名，末位再挂 `Node-A`（挂末位是刻意的：首项仍是 `MAX`，
    # 默认出口没有被一条占位节点顶掉）。本组**不带** `flatten`，与 Surge 的
    # `select, MAX, Smart, …, "Node-A"` 同形。
    policies:
    - MAX
    - Smart
    - Hong Kong
    - USA
    - Singapore
    - Taiwan
    - Japan
    - Korea
    - Other Regions
    - Node-A
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png
- smart:
    name: Smart
    # 【routing_v2.4】合并 Airport-A / Airport-B 为单一订阅入口 Airport。
    #   ⚠️ `flatten: true` **必须保留**：它是 Surge `smart, include-other-group="Airport"` 的对应物
    #   （Egern 官方：「展开嵌套策略组中的所有代理节点」）。少了它，smart 的候选只剩「Airport」
    #   这**一个组单位**，测不到组内任何节点 ⇒ 「自动选优」直接退化。地区组 / MAX 同理。
    policies:
    - Airport
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Auto.png
# ================================================================ 应用组（本段 12 个）
# ⚠️ 本段 12 个全部是 `select` + `flatten: true` —— 与 Surge 的 `select, include-other-group="Proxy"` 逐个等价。
#   （`WeChat` 同为应用组，但已是纯 `select, policies:[DIRECT]` —— 不带 `flatten`、不引用任何其它组，
#     见下方「订阅槽位 + 开关」段。）
#
#   Egern 的 `flatten: true`：把「Proxy」这个**组名**在求值期展开成组内**全部具体节点**
#     （官方原文：「展开嵌套策略组中的所有代理节点……而不是只显示策略组名称」）。
#   Surge 的 `include-other-group="Proxy"`：官方原文「includes the **resolved member
#     policies** from other policy groups」—— 同一语义。
#   ⇒ 两者**必须成对**。只写 `policies: [Proxy]` 却不加 `flatten`，成员就退化成
#     「Proxy」这**一个组单位**（≈ Surge 的 `select, Proxy`，要先点进去再选），
#     而不是 Surge 各应用组的「节点平铺」。本版即按此对齐。
#
#   首项 = 默认取向，逐组与 Surge 一致：ChatGPT / Gemini / AI / Spotify / YTMusic /
#   YouTube / GitHub / Telegram / Twitter 默认 `Proxy`；Claude 默认 `Taiwan`；
#   Google 默认 `Gemini`；Microsoft 默认 `DIRECT`。
#   ⚠️ 本版有两处首项不是组名池：`AI` 首项是本文件的 `Node-B`（占位节点），
#     `Spotify` / `YouTubeMusic` 首项是 `USA`。两侧（Surge / Egern）同写。
# ================================================================
- select:
    name: ChatGPT
    # 规则 4（OpenAI.list → ChatGPT）直接指向本组 ⇒ 必须始终有出口，默认 Proxy。
    policies:
    - Proxy
    flatten: true
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/openai.png
