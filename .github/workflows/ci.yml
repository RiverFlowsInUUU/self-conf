name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:17 UTC —— 抓「上游规则集悄悄改名/删档」这类本仓无从感知的变化
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需 tag：release_publish 从「上一个 tag..HEAD」汇总发布说明。
          # （归档判据已删，不再需要完整历史。）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Gates (Surge + Egern + mihomo)
        # ⚠️ 2026-10-08 第九轮审查问题 5：这一步此前**没传 GITHUB_TOKEN**，
        #    而 runner 上没有 gh 登录态 ⇒ verify_all._token() 回落失败，
        #    「Release 断言」实际是**匿名**打公共 API。
        #    ⇒ "CI 侧 exit 3 判失败"那层保险只在匿名调用本身失败时才触发（现在读得到，不触发）。
        #    现显式传入仓库自带的 GITHUB_TOKEN，让 Release 断言在 CI 里真正带凭据运行。
        run: python self-conf-skills/gates/verify_all.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Undefined names (F821)
        # ⚠️ 第十五轮新增（2026-10-08）。为什么值得单独一个 step：
        #    本仓两次栽在**同一类** bug —— `check_script_sync.py` 引用未定义的 `diff`、
        #    `check_badges.py` 引用未定义的 `NL`。两次都只在「异常/判负路径」上才炸：
        #    现役配置恒好 ⇒ 永不执行 ⇒ 本地与 CI 全绿，一旦真出事就给不出诊断，
        #    还会把「环境不达标(2)」变成「判负(1)」—— 环境坏了被读成判据判负。
        #    它也已进 verify_all（同源），此处**再跑一遍**是为了在 CI 日志里
        #    有一行**独立的、一眼可见的**结果，不必翻汇总表。
        #    刻意不用 pyflakes：外部依赖 + 29 条噪声里只 1 条真 bug，信噪比太低。
        run: python self-conf-skills/gates/check_undefined_names.py

      - name: Encoding gate (cp936)
        # 中文 Windows 下 print 非 GBK 字符会 UnicodeEncodeError 并以退出码 1 结束，
        # 而 1 恰是判负码 ⇒ 崩溃会被读成「判负」，整轮看着对其实判据没跑。
        run: python self-conf-skills/gates/verify_all.py
        env:
          PYTHONIOENCODING: cp936
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remote ruleset reachability (mihomo)
        # 慢；push 时严格，PR 时网络抖动不阻塞
        run: python self-conf-skills/gates/clash/check_remote_urls.py --timeout 20
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Encrypted DNS endpoints reachability (Egern)
        # 需联网实测每个加密 DNS 端点 ⇒ 不进闸门（抖动会假红），放在这里兜底。
        # 判负语义：脚本末尾会报「失效端点：N / 总数」。
        run: python self-conf-skills/run/egern/probe_dns_endpoints.py egern/profiles/routing.yaml
        continue-on-error: ${{ github.event_name == 'pull_request' }}
