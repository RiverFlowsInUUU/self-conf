#! version=lazy_v1.1
# ============================================================================
# Surge 懒人配置 · 防 DNS 泄露 + 广告拦截 + AI 分流
#
# 防 DNS 泄露结构 + 广告拦截（带白名单） + AI 分流 + 局域网共享。
#
# ⚠️ 本文件是**脱敏模板**：所有节点地址 / 端口 / 密码 / SNI 均为占位符。
#    导入前把 [Proxy] 段的节点换成你自己的，否则**所有走代理的流量都不通**。
#
# 结构（自上而下）：
#   [General]       全局：加密 DNS / IPv6 / GeoIP / 测试端点 / 安全开关
#   [Proxy]         节点：1 条 AnyTLS 中转链 + 2 条落地（占位）
#   [Proxy Group]   策略组：Proxy / AI / AD
#   [Rule]          规则：白名单 → 广告拦截 → AI → 系统 → 内网 → 国内 → 兜底
#   [Host] / [URL Rewrite]
#
# 防泄露的三条原则见 README 的「防泄露原理」一节，逐行理由见各段注释。
#
# audit-waive: 1 加密 DNS 端点保留 2 个主机名形式（dns.google / dns.alidns.com）。
#   这两个名字会被引导解析一次 —— 这是**刻意的取舍**，不是漏改：
#   换成纯 IP 字面量能消掉这一次解析，但会失去「按域名走 CDN 就近解析」与
#   「ECS 合规（不把公网 IP 交给非 CDN 的解析器）」两项收益。
#   消费者可自行取舍：想彻底消掉就把它们换成 IP 字面量。
# ============================================================================

[General]
loglevel = notify
show-error-page-for-reject = true

# --- DNS：加密、端点钉 IP、无明文通路 ----------------------------------------
# dns-server 必须写裸 IP，**绝不能写 system** —— 它只用于给加密 DNS 端点做
# 引导与连通性测试，如果它依赖系统解析器，就等于把引导过程交给了运营商 DHCP。
# 加密 DNS 端点全部写成 IP 字面量，因此启动期**没有任何主机名需要被明文解析**。
dns-server = 223.5.5.5, 119.29.29.29, 1.1.1.1, 8.8.8.8
encrypted-dns-server = https://1.1.1.1/dns-query, https://dns.google/dns-query, https://dns.alidns.com/dns-query
# 加密 DNS 连接一律走直连。保持 false 是为了避免 DoH 连接被绕回代理链形成环。
encrypted-dns-follow-outbound-mode = false
# 劫持硬编码的解析器请求：忽略 Surge DNS 的设备（HomePod / Apple TV /
# Chromecast / 智能音箱）发出的明文 :53 查询在这里被接管，不再裸奔到运营商。
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 208.67.222.222:53
allow-dns-svcb = false
exclude-simple-hostnames = true
read-etc-hosts = true
# 保持 false：本地映射只服务 DIRECT 路径。开启会把本地 DNS 结果变成硬性代理目标，
# 破坏远端解析（走代理的域名应该由节点侧解析，本地不该有它的答案）。
use-local-host-item-for-proxy = false

# --- IPv6 ------------------------------------------------------------------
# ipv6 = true 让真实 IPv6 站点可直连；ipv6-vif = auto 只在本地网络**确实有**
# 可用 IPv6 前缀时才让 VIF 承载 IPv6，避免在纯 IPv4 Wi-Fi 上留一条死掉的 AAAA
# 路径（表现为连接超时 + 额外耗电）。
ipv6 = true
ipv6-vif = auto

# --- GeoIP -----------------------------------------------------------------
geoip-maxmind-url = https://raw.githubusercontent.com/adysec/IP_database/main/geolite/GeoLite2-Country.mmdb
# 第三方手工构造的 mmdb 不一定带官方签名；自动更新保持开启，
# 若日志里出现更新报错，用这个开关关掉即可。
disable-geoip-db-auto-update = false

# --- 连通性与延迟测试 --------------------------------------------------------
test-timeout = 5
internet-test-url = http://connect.rom.miui.com/generate_204
# 延迟测试端点用**境外** 204。
#
# ⚠️ 它是**性能探针**，不是泄露通道 —— 别拿"藏掉解析"的理由去改它。
# 走代理策略时解析发生在代理服务器（官方 KB：「DNS 解析永远在代理服务器进行」），
# 本地不产生查询。它的职责是给 smart 组 / 地区组打分，
# 而**分流版尤其依赖这个分数**：地区组的整个意义就是"同地区的节点谁最快"，
# 用境外端点测出的延迟含国际段，才贴近你真实访问境外站点的体感。
proxy-test-url = http://www.gstatic.com/generate_204
# 专用的 UDP 探针（QUIC 类策略 + smart 组的 UDP 评分都要用它）。
proxy-test-udp = apple.com@1.1.1.1

# --- 流量处理 ---------------------------------------------------------------
# 有节点不支持 UDP 时，让请求走代理侧解析后的 TCP，而不是直接失败。
udp-policy-not-supported-behaviour = reject
# 游戏模式：系统繁忙时优先处理 UDP 包。
udp-priority = true
# 代理策略默认已阻止 QUIC；这里显式声明，只在确实有用的地方放行 QUIC。
block-quic = per-policy

# --- 局域网共享与安全 --------------------------------------------------------
allow-wifi-access = true
allow-hotspot-access = true
# 两者保持 true：即使上级网络的 DMZ / 端口转发配得潦草，
# 代理与网关监听端口也不会暴露到当前子网之外。
proxy-restricted-to-lan = true
gateway-restricted-to-lan = true

# --- Wi-Fi / 蜂窝行为 -------------------------------------------------------
# all-hybrid = true 会让每条 TCP 连接**和**每次 DNS 查询同时走 Wi-Fi + 蜂窝，
# 是明确的耗电与流量代价。保持 false。
all-hybrid = false
wifi-assist = false

# Real-IP 豁免：游戏机 / NTP / STUN 主机名必须拿到真实可路由地址而不是 fake-IP，
# 否则 NAT 类型检测和时间同步会坏。注意 Surge 内置的 SYSTEM 集合已覆盖 Apple 自家流量。
always-real-ip = *.lan, *.local, *.localdomain, *.home.arpa, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com, stun.*, time.*.com, ntp.*.com, *.pool.ntp.org, *.market.xiaomi.com

# ===========================================================================

[Proxy]
# --- Hysteria 2 ------------------------------------------------------------
# ⚠️ 占位节点，请替换为你的真实信息。203.0.113.0/24 是 RFC 5737 保留的
# 文档用地址段，不会指向任何真实主机。
#
# download-bandwidth 刻意不设置：它是**服务端**拥塞控制提示，填错会导致
# bufferbloat / 无谓重传。除非服务商明确公布数字，否则交给服务端决定。
Node-A = hysteria2, 203.0.113.10, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI

Node-B = hysteria2, 203.0.113.11, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI

# --- AnyTLS（中转链）-------------------------------------------------------
# reuse 保持默认（true）：连接复用正是"每个请求省掉一次 TCP+TLS 握手"的关键。
# 把它设成 false 是自找延迟。
#
# underlying-proxy 指向 Node-B：先连落地节点，再由它去连本节点。
# 这条链是本文件里唯一需要"按顺序改"的地方 —— 改之前先确认 underlying-proxy
# 指的名字真实存在，否则 Surge 会以「无法解析 underlying-proxy」拒绝加载。
#
# ⚠️ 下面这条 CDN 中转域名已脱敏（原为个人私有中转域名）。
Node-C = https, cdn-relay.example.com, 443, username="REPLACE_WITH_USERNAME", password="REPLACE_WITH_PASSWORD", underlying-proxy="Node-B", sni=cdn-relay.example.com

# --- HTTP / HTTPS ----------------------------------------------------------
# ⚠️ 注意：`https`（TLS 上的 HTTP 代理）**完全不支持 UDP 转发**。
# 落到这类节点上的 UDP 会被拒绝（由 udp-policy-not-supported-behaviour=reject 决定），
# 这也是它们只放在 AI 组、不做默认出口的原因。
#
# ⚠️ 下面这条的 server 是 IP 字面量（不是域名）—— 这是刻意的：IP 节点不产生
# "解析节点域名"这次查询，是本配置里唯一**必定发生**的本地解析，能省则省。
# skip-cert-verify 保持 true，因为落地只讲 HTTP over 443，TLS 由 AnyTLS 那一段提供。
Node-D = https, 203.0.113.20, 443, underlying-proxy="Node-A", skip-cert-verify=true, sni=203.0.113.20

# --- 内置策略别名（可选，当前未使用）-----------------------------------------
# Surge 允许在 [Proxy] 段给内置策略起别名，例如：
#   AdBlock = reject
# 之后就能在规则和策略组里使用这个名字。
#
# 下面那条广告规则**刻意没有**用别名，而是直接写字面量 REJECT。
# 原因：pre-matching 的校验对策略要求严格（必须是 REJECT 族**策略**本身），
# 字面量内置名保证能过。确认配置能正常加载后，如果你更喜欢具名策略，再改。
#
# ⚠️ 同样地，广告拦截**不能**指向一个策略组（哪怕该组只有 REJECT 一个成员）：
#    策略组在运行时可以解析成 DIRECT，Surge 会直接拒绝加载整份配置。
#    这也是本配置让拦截动作走字面量 REJECT、而 AD 组独立存在的原因（见下）。

# --- 已注释：不是 Surge 原生策略类型 -----------------------------------------
# VLESS Reality / XTLS 不是 Surge 的代理类型，写了会被跳过并告警，只是徒增解析噪音。
# Node-E = vless, 203.0.113.30, 443, ...

# ===========================================================================

[Proxy Group]
# smart 组：按**真实连接的首字节延迟**、TCP 重传丢包（每 1% 约 50ms）、
# UDP 响应延迟三项给成员打分，固定 5 分钟重测一次，并记住每个站点用哪个策略最合适。
# 成员越少选得越快，所以两个组都只放可用节点。
#
# 已移除：update-interval=3600（只对订阅型组有意义，写在这里是空转）、
# include-all-proxies=0 / no-alert=0 / hidden=0（都已是默认值）。
Proxy = smart, "Node-A", "Node-B", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png

AI = smart, "Node-C", "Node-D", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/openai.png

# AD 组：独立的手动开关，不被规则引用 —— 这是刻意的分层，不是遗漏。
# 职责划分：拦截动作走字面量 REJECT（为了拿到 pre-matching 的 DNS 阶段拦截），
#            AD 组负责"面板上随时可切，给人工干预留一个入口"。
# 改默认拦截行为：改 [Rule] 里那条 RULE-SET 的策略，或整行注释掉。
# 想让 AD 直接接管开关：把那行策略从 REJECT 改成 AD，但要一并去掉 pre-matching。
AD = select, REJECT, DIRECT, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/AdBlock.png

# ===========================================================================

[Rule]
# ---- 1. 广告白名单 ------------------------------------------------------
# 必须排在广告拦截**之前**：这 43 条是会被黑名单误杀的功能域，
# 要抢在 REJECT 之前放行。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-white-guard.list,DIRECT,"update-interval=604800"

# ---- 2. 广告拦截：pre-matching REJECT --------------------------------------
# pre-matching 的 REJECT 在 **DNS 查询阶段和 TCP-SYN 阶段**就被求值，
# 被拦的请求得到一个 "No Record" / TCP RST 就结束了，连接层完全不会启动。
# 对一个广告密集的配置来说，这是最大的一笔 CPU 与耗电优化。
#
# 策略必须是**字面量** REJECT 族策略。写成策略组会加载失败：组的成员在运行时
# 可能解析成 DIRECT，Surge 无法据此保证"一定拦得住"。
#
# 已核对该规则集的类型分布：38xx 条全部是 DOMAIN-SUFFIX / DOMAIN-WILDCARD，
# 都是 pre-matching 可用的类型。没有任何 IP-CIDR / USER-AGENT / URL-REGEX 条目。
#
# 想临时停用广告拦截：把策略改成 DIRECT，或整行注释掉。
#
# pre-matching  : 提前到 DNS / 连接阶段生效，最接近 Jinx 那种系统级 DNS 拦截体验
# extended-matching: 额外按 TLS SNI / HTTP Host 匹配，专治「App 直连 IP 导致域名规则失效」
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list,REJECT,"update-interval=604800",pre-matching,extended-matching

# ---- 2b. 第二条广告清单：AWAvenue（秋风）------------------------------------
# 与 Egern 的两条并列结构对齐（先 Jinx、后 AWAvenue），策略与参数同 2 号，同为
# pre-matching REJECT —— 拦在 DNS / TCP-SYN 阶段，不额外起连接。
#
# 已核对该规则集本体（2026-09-22，965 条）：
#   DOMAIN 949 / DOMAIN-SUFFIX 12 / DOMAIN-KEYWORD 4，**100% 域名类**，
#   无 IP-CIDR / URL-REGEX / USER-AGENT ⇒ pre-matching 可用的类型。
#
# 补它的收益（按「净新增覆盖」量化，不是看总条数）：
#   相对 Jinx 黑名单，**净新增 81 条（8.4%）** Jinx 未收录的广告域。
#
# ⚠️ 顺序是这条的命门：AWAvenue 会命中上面白名单里的 **10 条**功能域
#   （`jpush.cn` / `appcfg.v.qq.com` / 微信登录 `apd-pcdnwx*` / 字节 `tnc3-*` 等）。
#   白名单必须留在两条清单**之前**，否则这 10 条会被误杀。
#   ⚠️ 这条**不能**挪到 `direct.txt` / `GEOIP,CN` 之后 —— 一旦落到国内直连规则后面就永远轮不到。
RULE-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT,"update-interval=604800",pre-matching,extended-matching

# ---- 3. 局域网 / 内网 -------------------------------------------------------
# 内网排在广告之后、应用分流之前 —— 与 Egern 懒人版逐位同构（见 docs/规则集与来源.md §3）。
#
# LAN 含 IP-CIDR 条目（内置集实测 18 条），**必须** no-resolve；否则任何主机名的请求都会
# 先做一次公网 DNS 查询，只为拿来跟 10.0.0.0/8 比一下。那是纯粹的泄露面。
# private.txt 实测 130 条零 IP 条目 ⇒ 按 6 号那段的原则不写这个开关。
RULE-SET,LAN,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/private.txt,DIRECT,"update-interval=604800"

# ---- 4. Apple 系统服务直连（内置 SYSTEM，只此一条）---------------------------
# `SYSTEM` 是 Surge 内置集合，很小但权威（Apple 的激活 / 推送 / 定位 / 配对主机），
# 不依赖网络下载、规则集加载失败也不会失效 —— 懒人版要的就是这份"兜不丢"。
#
# 为什么懒人版不再引用远程 Apple 全量集：`Apple_All_No_Resolve.list`（1,616 条）多出来的
# 主要是 developer.apple.com / swcdn / courier.push 那类下载与开发者域；Apple 流量走代理
# 不会报错，只会变慢 + 推送延迟，而本配置只有一个 `Proxy` 出口，分不出"哪些该直连、
# 哪些该走代理"。分流版按应用分组，那份全集在那里才有意义（`routing_v3.2.conf` 位 ⑳）。
# ⚠️ 内置 `SYSTEM` 不含 App Store / iTunes 内容服务（官方口径，见 `egern/apple_system.list` 头注）。
# ⚠️ Egern 侧没有内置 `SYSTEM`：同一位置（位 ⑲）引用本仓自托管的时点快照
#    `egern/apple_system.list`，两边靠这个对齐，不是各自为政。
RULE-SET,SYSTEM,DIRECT

# ---- 5. AI / OpenAI --------------------------------------------------------
# 实测零 IP 条目（49 条全是域名类）⇒ 不写规则级 no-resolve，见 6 号那段。
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/75f0101039d71724b6e998b34604c2e053580e0c/Clash/Ruleset/AI.list,AI,"update-interval=604800"

# ---- 6. 国内直连（域名类，主承重墙）-----------------------------------------
# 规则级 no-resolve 的取舍，本仓四份 profile 共用一条原则：
#   **实测零 IP 条目的规则集不写，真含 IP 条目的必须写。**
# 那个开关只对规则集里的 IP 类条目起作用：纯域名集写上是空转；含 IP 的集不写，就会让
# 每个还没被前面命中的域名在这里**被强制本地解析一次** —— 那正是泄露本身。
# 本份文件里"真含 IP"的只有上面的 `LAN` 和下面的 `GEOIP,CN`。
# ⚠️ 判据是**实测零 IP**，不是"纯域名"：`YouTubeMusic` / `Microsoft` 那类含
#    USER-AGENT / PROCESS-NAME 的集同样零 IP，依据要写准（分流版 §3 有逐个实测表）。
#
# direct.txt 是国内直连的主力（约 11.1 万条纯域名、零 IP 条目）—— 下面那条 GEOIP,CN
# 因为带 no-resolve 已经不再匹配域名，所以国内域名**只能靠这里**接住。
# ⚠️ 条数**不写死**（清单每周随上游更新，写进注释的精确数必然过期）：约 11.09 万条
#    DOMAIN-SUFFIX + 约 550 条 DOMAIN。要现值就现抓：
#    `python skill/scripts/surge/audit_ruleset_content.py <本文件>`。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,DIRECT,"update-interval=604800"

# ---- 7. IP 规则，放最后 -----------------------------------------------------
# IP 类规则需要有已解析的地址。放在所有域名规则之后，使走代理 / 被广告拦截 /
# 国内直连的流量都不必做本地 DNS 查询。
# no-resolve 让它对未解析的主机名**跳过**，而不是暂停规则求值去解析它。
GEOIP,CN,DIRECT,no-resolve

# ---- 8. 兜底 ---------------------------------------------------------------
# dns-failed：万一规则求值因 DNS 失败而中断，用代理策略而不是让请求直接失败。
# 走代理的域名由节点远端解析，所以这一条既修好了失败，也避免了一次明文本地查询。
FINAL,Proxy,dns-failed

# ===========================================================================

[Host]
# 只列 Surge 自带 DNS 客户端可能处理错的那几个特殊主机名。
# localhost 内部就能解析，*.lan 已被 exclude-simple-hostnames + LAN 规则覆盖，
# 再映射一遍是冗余的。
localhost = server:system
*.lan = server:system
*.local = server:system

[URL Rewrite]
^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302
