# ============================================================================
# Surge 分流配置 · 按应用 + 按地区选路
#
# 与 lazy.conf 的分工：
#   lazy.conf     极简 —— 3 个策略组，全量流量一个出口，只做「防泄露 + 广告拦截 + AI」
#   routing_v3.conf  分流 —— 按应用分组（ChatGPT / Claude / AI / Google …），
#                 Smart / 地区组内部还可继续按地区或倍率选优
#
# 两份的 [General] DNS 段与防泄露结构**完全一致**（由测试逐字断言），
# 差别只在 [Proxy Group] 的粒度。选一个用即可，不要叠加。
#
# ⚠️ [Proxy Group] 的**组顺序与 Egern v3 对齐**，段序如下：
#    ① 总入口 → ② 应用组 → ③ 订阅槽位 + 开关 → ④ 地区 / 精选 → ⑤ 兜底
#    这样排的道理是「先写引用别人的，后写被引用的」——
#    读配置时先看到"谁在用"，再看"节点从哪来"，不用来回跳。
#
# ⚠️ 本文件是**脱敏模板**：
#   · **不附带任何本机节点**（`[Proxy]` 为空，与 Egern 模板的 `proxies: []` 一致）；
#   · 订阅 URL 里只有域名与 token 占位符，**不含任何真实机场地址**。
#   导入前**只需替换订阅 URL**（`Airport` 组的 `policy-path`）；不换的话走代理的流量都不通。
#
# 结构（自上而下）：
#   [General]       全局：与 lazy.conf 逐字相同
#   [Proxy]         节点：空（节点全部来自订阅）
#   [Proxy Group]   策略组：Proxy → Smart → 应用组 → Airport / WeChat / AD
#                           → 地区组 → MAX → Final
#   [Rule]          规则：白名单 → 广告拦截 → 内网 → 各应用 → Apple → 微信 → 国内 → IP → 兜底
#   [Host] / [URL Rewrite]
#
# audit-waive: 1 加密 DNS 端点保留 2 个主机名形式（dns.google / dns.alidns.com）。
#   这两个名字会被引导解析一次 —— 这是**刻意的取舍**，不是漏改：
#   换成纯 IP 字面量能消掉这一次解析，但会失去「按域名走 CDN 就近解析」与
#   「ECS 合规（不把公网 IP 交给非 CDN 的解析器）」两项收益。
#   消费者可自行取舍：想彻底消掉就把它们换成 IP 字面量。
# ============================================================================

[General]
loglevel = notify
show-error-page-for-reject = true

# --- DNS：加密、端点钉 IP、无明文通路 ----------------------------------------
# dns-server 必须写裸 IP，**绝不能写 system** —— 它只用于给加密 DNS 端点做
# 引导与连通性测试，如果它依赖系统解析器，就等于把引导过程交给了运营商 DHCP。
# 加密 DNS 端点全部写成 IP 字面量，因此启动期**没有任何主机名需要被明文解析**。
dns-server = 223.5.5.5, 119.29.29.29, 1.1.1.1, 8.8.8.8
encrypted-dns-server = https://1.1.1.1/dns-query, https://dns.google/dns-query, https://dns.alidns.com/dns-query
# 加密 DNS 连接一律走直连。保持 false 是为了避免 DoH 连接被绕回代理链形成环。
encrypted-dns-follow-outbound-mode = false
# 劫持硬编码的解析器请求：忽略 Surge DNS 的设备（HomePod / Apple TV /
# Chromecast / 智能音箱）发出的明文 :53 查询在这里被接管，不再裸奔到运营商。
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 208.67.222.222:53
allow-dns-svcb = false
exclude-simple-hostnames = true
read-etc-hosts = true
# 保持 false：本地映射只服务 DIRECT 路径。开启会把本地 DNS 结果变成硬性代理目标，
# 破坏远端解析（走代理的域名应该由节点侧解析，本地不该有它的答案）。
use-local-host-item-for-proxy = false

# --- IPv6 ------------------------------------------------------------------
# ipv6 = true 让真实 IPv6 站点可直连；ipv6-vif = auto 只在本地网络**确实有**
# 可用 IPv6 前缀时才让 VIF 承载 IPv6，避免在纯 IPv4 Wi-Fi 上留一条死掉的 AAAA
# 路径（表现为连接超时 + 额外耗电）。
ipv6 = true
ipv6-vif = auto

# --- GeoIP -----------------------------------------------------------------
geoip-maxmind-url = https://raw.githubusercontent.com/adysec/IP_database/main/geolite/GeoLite2-Country.mmdb
# 第三方手工构造的 mmdb 不一定带官方签名；自动更新保持开启，
# 若日志里出现更新报错，用这个开关关掉即可。
disable-geoip-db-auto-update = false

# --- 连通性与延迟测试 --------------------------------------------------------
test-timeout = 5
internet-test-url = http://connect.rom.miui.com/generate_204
# 延迟测试端点用**境外** 204。
#
# ⚠️ 它是**性能探针**，不是泄露通道 —— 别拿"藏掉解析"的理由去改它。
# 走代理策略时解析发生在代理服务器（官方 KB：「DNS 解析永远在代理服务器进行」），
# 本地不产生查询。它的职责是给 smart 组 / 地区组打分，
# 而**分流版尤其依赖这个分数**：地区组的整个意义就是"同地区的节点谁最快"，
# 用境外端点测出的延迟含国际段，才贴近你真实访问境外站点的体感。
proxy-test-url = http://www.gstatic.com/generate_204
# 专用的 UDP 探针（QUIC 类策略 + smart 组的 UDP 评分都要用它）。
proxy-test-udp = apple.com@1.1.1.1

# --- 流量处理 ---------------------------------------------------------------
# 有节点不支持 UDP 时，让请求走代理侧解析后的 TCP，而不是直接失败。
udp-policy-not-supported-behaviour = reject
# 游戏模式：系统繁忙时优先处理 UDP 包。
udp-priority = true
# 代理策略默认已阻止 QUIC；这里显式声明，只在确实有用的地方放行 QUIC。
block-quic = per-policy

# --- 局域网共享与安全 --------------------------------------------------------
allow-wifi-access = true
allow-hotspot-access = true
# 两者保持 true：即使上级网络的 DMZ / 端口转发配得潦草，
# 代理与网关监听端口也不会暴露到当前子网之外。
proxy-restricted-to-lan = true
gateway-restricted-to-lan = true

# --- Wi-Fi / 蜂窝行为 -------------------------------------------------------
# all-hybrid = true 会让每条 TCP 连接**和**每次 DNS 查询同时走 Wi-Fi + 蜂窝，
# 是明确的耗电与流量代价。保持 false。
all-hybrid = false
wifi-assist = false

# Real-IP 豁免：游戏机 / NTP / STUN 主机名必须拿到真实可路由地址而不是 fake-IP，
# 否则 NAT 类型检测和时间同步会坏。注意 Surge 内置的 SYSTEM 集合已覆盖 Apple 自家流量。
always-real-ip = *.lan, *.local, *.localdomain, *.home.arpa, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com, stun.*, time.*.com, ntp.*.com, *.pool.ntp.org, *.market.xiaomi.com

# ===========================================================================

[Proxy]
# ⚠️ 本模板**不附带任何本机节点**（与 Egern 模板的 `proxies: []` 一致）。
#   节点**全部来自订阅**（`Airport` 组的 `policy-path`）—— 所以地区组 / `MAX` 只需
#   `include-other-group="Airport"` 就能拿到节点，**不需要** `include-all-proxies`。
#
# 要加你自己的节点（自建 / 中转链 / 本地入口）就在这里写：`名字 = 类型, 服务器, 端口, 参数…`
#   ⚠️ 名字里带上地区关键词（如 `HK` / `香港`），地区组的 `policy-regex-filter` 才认得出。
#   ⚠️ 但**显式写在本节的节点不受 `policy-regex-filter` 影响** —— 官方原文：正则
#      "applies to members from policy-path, include-all-proxies, and include-other-group,
#      but not to explicitly listed members"。想让本机节点也进地区组，就给对应组补一个
#      `include-all-proxies=true`（本模板不带本机节点，故未启用该参数）。
#   ⚠️ AnyTLS / `https` 中转链：`underlying-proxy="落地节点名"` 指的名字必须真实存在，
#      否则 Surge 会以「无法解析 underlying-proxy」拒绝加载。
#
# 例（203.0.113.x 是 RFC 5737 文档地址段，不指向任何真实主机）：
# Node-HK-01 = hysteria2, 203.0.113.10, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI

# ===========================================================================
# [Proxy Group] —— 分流版的全部机关都在这一段
#
# ⚠️ 先说一件**必须知道**的事，否则你会在官方文档里撞墙：
#
#   Egern 有 `flatten: true` —— 把「Proxy」这个**组名**在求值时替换成组内的
#   **全部具体节点**，于是 smart 可以逐个节点测速。**Surge 没有 flatten。**
#
#   Surge 的对应物是 `include-other-group="X"`：官方原文说它
#   "includes the **resolved member policies** from other policy groups" ——
#   同样是"复制已经解析出来的成员"，语义与 flatten 一致（可递归、可配正则）。
#
#   ⚠️ 但有一条硬限制（官方 Smart 组文档原文）：
#      「Smart 策略组不可以使用其他组作为子策略，也不可以用作 url-test 组的子策略。
#        但是可以使用 include-other-group 参数从其他组复制子策略。」
#
#   ⇒ 所以本配置按**用途**分两种写法，不是随意的风格差异：
#
#     ① 需要 smart 自动选优的地方（Smart / 7 个地区组 / MAX）
#        → 用 `include-other-group` / `policy-path`，让 smart 拿到**具体节点**。
#          这是唯一能让 smart 真正对节点逐个测速的写法。
#
#     ② 需要「能复制到 Proxy 全部节点、又能在面板上手动接管」的地方
#        （12 个应用组：ChatGPT / Gemini / Claude / AI / Spotify / YouTubeMusic /
#          YouTube / GitHub / Google / Microsoft / Telegram / Twitter）
#        → 用 `select` + `include-other-group="Proxy"`，**与 Egern 逐字对齐**。
#          ⚠️ 成员只有 `include-other-group`、**不再**把地区组名列进成员 ——
#          Egern 的应用组 `policies` 只有 `[Proxy]` 一项（外加 `flatten: true`），没有地区列表；
#          此前"列地区组"是自创写法，与 Egern 语义不符，已改正。
#
#     ⚠️ 以下三组**不在 ② 之列**（都是纯 `select` + 字面量成员，不带 `include-other-group`）：
#        · `Proxy`（总入口）—— 成员是各组名（`MAX` / `Smart` / 7 个地区组）；
#        · `Final`（兜底）  —— 成员只有 `Proxy` 组名；展开会把默认出口钉死在具体节点、不再跟随 `Proxy`；
#        · `WeChat`        —— 成员只有 `DIRECT`（微信直连），刻意不给其它出口。
#
#     ⚠️ 一个必须说清的差异：Egern 的应用组用的是 `fallback` / `smart`（**自动**故障转移），
#        Surge 的 `select` 是**纯手动**类型。所以本段的代理组给的是
#        「默认走 Proxy 的全部节点 + 面板上可手动改」，**没有**自动故障转移。
#        想要自动选优，把某个组换成 `smart, include-other-group="Proxy"` 即可
#        （代价：面板上不能再手动挑节点）。
# ===========================================================================

[Proxy Group]

# --- ① 总入口 ---------------------------------------------------------------
# ===========================================================================
# smart 组：按**真实连接的首字节延迟**、TCP 重传丢包、UDP 响应延迟三项给成员打分，
# 定期重测，并记住每个站点用哪个策略最合适。
#
# **首项是 `MAX`**（低倍率节点池）—— 与 Egern v3 一致。
#   代价要说清：默认出口会优先落在低倍率节点上，更省钱但可能更慢。
#   不想这样就把 `MAX` 从首项删掉（只留 `Smart` 一项也行）。
#
# `include-other-group` 把订阅组里**具体节点**复制进来。
# 不这么写的话，smart 的成员会只有「Airport」这一个**组名单位**：
# 它测不到组内的节点，整组的"自动选优"就退化成"在几个组之间猜"。
Proxy = select, MAX, Smart, Hong Kong, USA, Singapore, Taiwan, Japan, Korea, Other Regions, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png

# 全节点池。相对 Proxy 少了 MAX 与地区组，只有全部具体节点。
# 用途：给需要"节点级候选"的地方当一个干净池子。
Smart = smart, include-other-group="Airport", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Auto.png

# ===========================================================================
# --- ② 应用组 ---------------------------------------------------------------
# ===========================================================================
# 与 Egern v3 的对应关系（**这一版改正了此前的错误理解**）：
#
#   Egern                          Surge
#   ────────────────────────────   ─────────────────────────────────────────
#   policies: [Proxy]              select, include-other-group="Proxy"
#   + flatten: true
#
#   Egern 的 `flatten: true` 是把 `Proxy` 这个**组名**展开成它内部的**全部具体节点**，
#   组内做「节点级」的顺序尝试 / 故障转移 —— **不是**"把地区组列成成员"。
#   此前本配置把应用组写成"列所有地区组"，那是自创写法，与 Egern 语义不符，已改正。
#
#   ⚠️ Surge 侧的一个差异必须说明：Egern 这里用的是 `fallback` / `smart` 类型（自动故障转移），
#      Surge 的 `select` 是**纯手动**类型。所以本段给的是
#      「默认走 Proxy 的全部节点 + 面板上可手动改」，**没有**自动故障转移。
#      想要自动选优，把某个组换成 `smart, include-other-group="Proxy"` 即可
#      （代价：面板上不能再手动挑节点）。
#
#   ⚠️ 成员只有 `include-other-group`，**没有**显式节点名 ——
#      这是 Surge 的硬约束：Smart 族组不接受组名成员，且显式成员不受
#      policy-regex-filter 影响。全用 include-other-group 最干净。

# OpenAI / Sora / ChatGPT
ChatGPT = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/openai.png

# Google 的 AI 服务。独立成组是因为下面的 `Google` 组首项指向它。
Gemini = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/gemini-color.png

# Anthropic / Claude —— 与 Egern 一致：默认走**台湾**组（Claude 对台湾线路较友好）。
# ⚠️ 订阅里没有台湾节点时这一组会空，指向它的规则会断；导入后到面板确认一下。
Claude = select, Taiwan, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/claude-color.png

# 其余 AI 类域名（ACL4SSR 的 AI.list）
AI = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/grok.png

# Spotify
Spotify = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Spotify.png

# YouTube Music
YouTubeMusic = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/YouTubeMusic.png

# YouTube
YouTube = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/YouTube.png

# GitHub
GitHub = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/GitHub.png

# Google —— 首项是 `Gemini` 组 ⇒「Google 走 Gemini → Proxy」，与 Egern 一致。
Google = select, Gemini, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Google.png

# Microsoft —— 首项是 `DIRECT`（Egern 的取向：微软服务直连优先，走代理反而慢）。
Microsoft = select, DIRECT, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Microsoft.png

# Telegram
Telegram = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Telegram.png

# Twitter / X
Twitter = select, include-other-group="Proxy", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Twitter.png

# ===========================================================================
# --- ③ 订阅槽位 + 开关 ------------------------------------------------------
# ===========================================================================

# 订阅入口。只做一件事：把订阅链接里的节点拉进来。
# `hidden=true` 让它不在面板菜单里显示 —— 它本来就不该被手动选中，
# 引用它的永远是 `include-other-group="Airport"`。
#
# ⚠️ 把 URL 换成你自己的订阅。token 已用占位符，不含任何真实机场地址。
Airport = select, policy-path=https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN, update-interval=86400, hidden=true, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Airport.png

# WeChat —— 成员**只有 `DIRECT`**（Egern 的取向：微信直连）。
# 作用是把微信**从兜底里摘出来**，避免它被 `Final` 送进代理。
# ⚠️ 刻意**不带** `include-other-group`：微信不给其它出口（与 Egern 的 `select, policies:[DIRECT]` 一致）。
WeChat = select, DIRECT, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/WeChat.png

# 广告拦截的手动开关，不被规则引用。
# 拦截动作走字面量 `REJECT`（为了拿到 pre-matching 的 DNS 阶段拦截），
# 本组负责"面板上随时可切，给人工干预留一个入口"。
# 想让本组接管开关：把 [Rule] 里那条 RULE-SET 的策略从 `REJECT` 改成 `AD`，
# 但必须一并去掉 `pre-matching`。
AD = select, REJECT, DIRECT, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/AdBlock.png

# ===========================================================================
# --- ④ 地区组 + 精选 --------------------------------------------------------
# ===========================================================================
# 每个地区组 = 「订阅里的节点」 + 「正则只保留该地区」。
#
# ⚠️ 本模板不带本机节点（`[Proxy]` 为空），节点全部经 `include-other-group="Airport"`
#    从订阅取 —— 正则对它生效，所以**不需要** `include-all-proxies`（与 Egern 一致）。
#
# ⚠️ 但要知道：`policy-regex-filter` **对显式列出的成员无效**。官方 policy-including 原文：
#    "applies to members from policy-path, include-all-proxies, and include-other-group,
#     but not to explicitly listed members"。
#    ⇒ 你日后往 `[Proxy]` 加本机节点时，它们**不会**被正则筛进来；想筛，就给对应组补
#      `include-all-proxies=true`。
#
# ⚠️ 地区名是**两份拷贝**：每个地区组写自己的正则，而 `Other Regions` 的负向断言
#    把其它 6 个组的关键词又抄了一遍。**改任何一个地区组，都要同步改 Other Regions。**
#    校验：`python skill/scripts/audit_region_filters.py profiles/routing_v3.conf`
#
# ⚠️ 空组是允许的（订阅里没有该地区的节点时就会空）。Surge 不会因此拒绝加载，
#    但如果某条规则指向了空组，那条规则的流量会断。导入后到面板上看一眼。

# 香港（含「深港 / 沪港 / 京港 / 广港」这类中转写法）
Hong Kong = smart, include-other-group="Airport", policy-regex-filter=(?i)🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/HongKong.png

# 美国（含主要城市名与机场三字码；`\bUSA?\b` 匹配 US / USA）
USA = smart, include-other-group="Airport", policy-regex-filter=(?i)🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/UnitedStates.png

# 日本
Japan = smart, include-other-group="Airport", policy-regex-filter=(?i)🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Japan.png

# 中国台湾
Taiwan = smart, include-other-group="Airport", policy-regex-filter=(?i)🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Taiwan.png

# 新加坡
Singapore = smart, include-other-group="Airport", policy-regex-filter=(?i)🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Singapore.png

# 韩国
Korea = smart, include-other-group="Airport", policy-regex-filter=(?i)🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Korea.png

# 其它地区 —— 用**负向断言**排除上面 6 个地区的全部关键词。
# 末尾那串 `倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组`
# 是为了把订阅里常见的"信息行节点"（「剩余流量：100GB」这种）也排除掉。
#
# ⚠️ 它的关键词与上面 6 个组**完全重复**，是本文件里最大的一处维护负担。
#    Surge 的 filter 不支持引用变量，消灭不掉 —— 只能靠脚本守，见上面的校验命令。
Other Regions = smart, include-other-group="Airport", policy-regex-filter=(?xi)^(?!.*(?:🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b|🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组)).+$, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/WorldMap.png

# 只收**倍率小于 1** 的节点（0.01 / 0.08 / 0.1 / 0.2 / 0.5 / 0.99 …）。
#
# ⚠️ 正则为什么不是简单的 `0\.\d`：
#   · `(?<![\d.])` 保证 `0.` 前面不是数字或点 ⇒ 排除 `10.1 倍率` / `100.12 GB` 的尾部
#   · `0\.` 锁定小数形态 ⇒ 排除整数 `1x` / `2x`
#   · `\d*[1-9]` 要求至少一位非零数字 ⇒ 排除无意义的 `0.0`
#
# ⚠️ 残留风险（已知边界，未修）：若订阅把「信息行」也塞成节点名，
#    `剩余流量：0.5 TB` 这类仍会被收（0.5 < 1，从倍率语义看是"对的"）。
#    真遇到时在 filter 前面再加一段负向断言（排除「剩余流量 / 套餐到期」）即可。
MAX = smart, include-other-group="Airport", policy-regex-filter=(?<![\d.])0\.\d*[1-9], icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Nfcloud.png

# ===========================================================================
# --- ⑤ 兜底 ----------------------------------------------------------------
# ===========================================================================
# `FINAL` 规则指向本组，而不是直接写 `Proxy` —— 这样面板上还能改兜底去向。
# ⚠️ 本组**不带** `include-other-group`（对应 Egern 的 `select, policies:[Proxy]`，无 `flatten`）。
#    `include-other-group` / `flatten` 会把 `Proxy` 这个**组名替换成具体节点**，
#    默认出口就钉死在某个节点上、**不再跟随 `Proxy` 的动态选优** —— 而兜底要的正是「跟随 `Proxy`」。
#    以 Egern 为准，故这里只留组名成员。
Final = select, Proxy, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Final.png

[Rule]
# ---- 1. 广告白名单 ------------------------------------------------------
# 必须排在广告拦截**之前**：这 43 条是会被黑名单误杀的功能域，
# 要抢在 REJECT 之前放行。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-white-guard.list,DIRECT

# ---- 2. 广告拦截：pre-matching REJECT --------------------------------------
# pre-matching 的 REJECT 在 **DNS 查询阶段和 TCP-SYN 阶段**就被求值，
# 被拦的请求得到一个 "No Record" / TCP RST 就结束了，连接层完全不会启动。
#
# 策略必须是**字面量** REJECT 族策略。写成策略组会加载失败：组的成员在运行时
# 可能解析成 DIRECT，Surge 无法据此保证"一定拦得住"。
#
# 想临时停用广告拦截：把策略改成 DIRECT，或整行注释掉。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/surge-ads.list,REJECT,pre-matching,extended-matching

# ---- 2b. 第二条广告清单：AWAvenue（秋风）------------------------------------
# 与 Egern 的两条并列结构对齐（先 Jinx、后 AWAvenue），策略与参数同 2 号，同为
# pre-matching REJECT —— 拦在 DNS / TCP-SYN 阶段，不额外起连接。
#
# 已核对该规则集本体（2026-09-22，965 条）：
#   DOMAIN 949 / DOMAIN-SUFFIX 12 / DOMAIN-KEYWORD 4，**100% 域名类**，
#   无 IP-CIDR / URL-REGEX / USER-AGENT ⇒ pre-matching 可用的类型。
#
# 补它的收益（按「净新增覆盖」量化，不是看总条数）：
#   相对 Jinx 黑名单，**净新增 81 条（8.4%）** Jinx 未收录的广告域。
#
# ⚠️ 顺序是这条的命门：AWAvenue 会命中上面白名单里的 **10 条**功能域
#   （`jpush.cn` / `appcfg.v.qq.com` / 微信登录 `apd-pcdnwx*` / 字节 `tnc3-*` 等）。
#   白名单必须留在两条清单**之前**，否则这 10 条会被误杀。
#   ⚠️ 这条**不能**挪到 `direct.txt` / `GEOIP,CN` 之后 —— 一旦落到国内直连规则后面就永远轮不到。
RULE-SET,https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list,REJECT,pre-matching,extended-matching

# ---- 3. 局域网 / 内网 -------------------------------------------------------
# LAN 含 IP-CIDR 条目，**必须** no-resolve；否则任何主机名的请求都会先做一次
# 公网 DNS 查询，只为拿来跟 10.0.0.0/8 比一下。那是纯粹的泄露面。
# 位置对齐 Egern（置于应用分流之前）：清单内域名不在任何应用清单中，IP 段带
# no-resolve 不触发解析 ⇒ 提前与否语义等价，仅为两侧顺序逐行一致。
RULE-SET,LAN,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/private.txt,DIRECT,no-resolve

# ---- 3. 按应用分流（粒度最细的规则放最前面）--------------------------------
# 顺序铁律：**越具体的越靠前**。这些应用规则必须排在下面的国内直连集之前，
# 否则一个 「ChatGPT 但域名恰好被国内清单收录」的场景会被直连接走。
#
# 全部带 no-resolve：这些规则集 100% 是域名条目，不需要为它们触发解析。
#
# ⚠️ 组内顺序也是刻意的：厂商专属规则（OpenAI / Gemini / Anthropic / Claude）
#    必须排在通用 `AI.list` **之前**，否则 AI 域名会先被 AI.list 接走，
#    永远轮不到 ChatGPT / Gemini / Claude 组。

# --- 3a. AI 厂商（专属优先）--------------------------------------------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list,ChatGPT,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list,Gemini,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Anthropic/Anthropic.list,Claude,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list,Claude,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/75f0101039d71724b6e998b34604c2e053580e0c/Clash/Ruleset/AI.list,AI,"update-interval=86400",no-resolve

# --- 3b. 媒体与社交 ----------------------------------------------------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list,Spotify,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTubeMusic/YouTubeMusic.list,YouTubeMusic,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list,YouTube,"update-interval=86400",no-resolve

# --- 3c. 开发与系统 ----------------------------------------------------------
# ⚠️ GitHub 这一条**必须排在 direct.txt 之前**：github.com 同时被
#    白名单（43 条，用于放行被广告黑名单误杀的功能域）和国内清单收录，
#    而 GitHub 组默认走 Proxy —— 这正是"应用分流"要生效的地方。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list,GitHub,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list,Microsoft,"update-interval=86400",no-resolve

# --- 3d. 社交（Telegram / Twitter）---
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Telegram,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list,Twitter,"update-interval=86400",no-resolve

# ---- 3e. 禁用条目（与 Egern 对齐）------------------------------------------
# blackmatrix7 Proxy.list：注释掉 = 不参与匹配，与 Egern 的 `disabled: true` 对齐。
# RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy.list,Proxy

# ---- 5. Apple 服务直连 ------------------------------------------------------
# 这一节对应 Egern v3 里的 `Apple_All_No_Resolve.list -> DIRECT`。
#
# 为什么是**两条**而不是一条：
#   - `SYSTEM` 是 Surge 内置集合，很小但权威（Apple 的激活 / 推送 / 定位 / 配对主机），
#     不依赖网络下载，加载失败也不会失效 —— 留它做**保底**。
#   - `Apple_All_No_Resolve.list` 覆盖面大得多（developer.apple.com、gs-loc.apple.com、
#     courier.push.apple.com、swcdn.apple.com …），是「Apple 服务」的实际承担者。
#   两条都在 => 覆盖面 + 兜不丢，且因为有 SYSTEM 在前，即便规则集下载失败也退化得可接受。
#
# ⚠️ 必须用 **No_Resolve** 版本，不能用 Apple_All.list —— 这是 Egern 项目踩过的坑：
#    Apple_All.list 里有 13 条 IP-CIDR 没带 no-resolve（139.178.128.0/18 等 Apple CDN 段），
#    而本条规则排在后面那些 IP 规则**之前**且策略是 DIRECT ⇒ 每个还没命中的域名
#    经过这里都会**被强制解析一次**。那条解析走的是本地 DNS，就是泄露本身。
#    No_Resolve 版与原版逐条等价（只是那 13 条补上了 `,no-resolve`），覆盖面无损失。
RULE-SET,SYSTEM,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All_No_Resolve.list,DIRECT,"update-interval=86400"

# ---- 6. 即时通讯 WeChat（直连优先，对齐 Egern：置于 Apple 之后）-------------------------------------------------
# WeChat 组首项是 DIRECT ⇒ 把微信从兜底里摘出来，避免被 FINAL 送进代理。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list,WeChat,"update-interval=86400",no-resolve


# ---- 7. 国内直连（域名类，主承重墙）-----------------------------------------
# 显式 no-resolve。这份清单是纯域名类规则集（11 万条 DOMAIN-SUFFIX / DOMAIN），
# 是国内直连的主力 —— 下面那条 GEOIP,CN 因为带 no-resolve 已经不再匹配域名，
# 所以国内域名**只能靠这里**接住。
#
# ⚠️ 分流版与 lazy.conf 在这一点上**完全一致**：国内域名直连不靠 geoip，靠这份清单。
#    这也是为什么本文件不需要 Egern 的 `domain_suffix: cn` 兜底 —— direct.txt 已含 .cn。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,DIRECT,no-resolve

# ---- 8. IP 规则，放最后 -----------------------------------------------------
# IP 类规则需要有已解析的地址。放在所有域名规则之后，使走代理 / 被广告拦截 /
# 国内直连的流量都不必做本地 DNS 查询。
# no-resolve 让它对未解析的主机名**跳过**，而不是暂停规则求值去解析它。
GEOIP,CN,DIRECT,no-resolve

# ---- 9. 兜底 ---------------------------------------------------------------
# dns-failed：万一规则求值因 DNS 失败而中断，用代理策略而不是让请求直接失败。
# 走代理的域名由节点远端解析，所以这一条既修好了失败，也避免了一次明文本地查询。
FINAL,Final,dns-failed

# ===========================================================================

[Host]
# 只列 Surge 自带 DNS 客户端可能处理错的那几个特殊主机名。
# localhost 内部就能解析，*.lan 已被 exclude-simple-hostnames + LAN 规则覆盖，
# 再映射一遍是冗余的。
localhost = server:system
*.lan = server:system
*.local = server:system

[URL Rewrite]
^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302
