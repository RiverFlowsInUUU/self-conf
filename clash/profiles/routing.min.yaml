ipv6: false
proxy-providers:
  Airport:
    type: http
    url: https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    path: ./proxy_provider/Airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Smart
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States
      - Other Regions
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/Proxy.png
  - name: Smart
    type: fallback
    proxies:
      - Low Mult.
      - Auto
      - High Mult.
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/Auto.png
  - name: Low Mult.
    type: url-test
    include-all: true
    filter: '^(?=.*(?:^|[^\d.])(0\.\d*[1-9]))((?!直连|DIRECT).)*$'
    exclude-filter: 剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: Auto
    type: url-test
    include-all: true
    filter: '^(?!.*(?:^|[^\d.])(0\.\d*[1-9]))(?!.*(?:^|[^\d.])([1-9]\d*(?:\.\d+)?\s*(?:倍率|倍|x|X|\*)))((?!直连|DIRECT).)*$'
    exclude-filter: 剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: High Mult.
    type: url-test
    include-all: true
    filter: '^(?=.*(?:^|[^\d.])([1-9]\d*(?:\.\d+)?\s*(?:倍率|倍|x|X|\*)))((?!直连|DIRECT).)*$'
    exclude-filter: 剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: ChatGPT
    type: select
    proxies:
      - United States
      - Taiwan
      - Japan
      - Singapore
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/openai.png
  - name: Gemini
