  - RULE-SET,private,DIRECT
  - RULE-SET,anthropic,Claude
  - RULE-SET,category-ai-chat-!cn,AI
  - DOMAIN-SUFFIX,music.youtube.com,YouTube Music
  - RULE-SET,github,Proxy
  - RULE-SET,youtube,YouTube
  - RULE-SET,emby,Emby
  - RULE-SET,google,Google
  - RULE-SET,spotify,Spotify
  - RULE-SET,twitter,Twitter
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,telegram,Telegram
  - RULE-SET,geoip-google,Google
  - RULE-SET,geoip-telegram,Telegram
  - RULE-SET,cn,DIRECT
  - RULE-SET,geoip-cn,DIRECT
  - MATCH,Proxy
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - https://doh.18bit.cn/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.18bit.cn/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
  nameserver-policy:
    rule-set:AWAvenue-Ads: rcode://success
    rule-set:Jinx-Ads: rcode://success
    rule-set:private,cn:
      - https://doh.18bit.cn/dns-query
      - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - '*.home.arpa'
    - +.msftconnecttest.com
    - +.msftncsi.com
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.xboxlive.com
    - 'stun.*'
    - 'time.*.com'
    - 'ntp.*.com'
    - +.pool.ntp.org
    - +.market.xiaomi.com
    - rule-set:AWAvenue-Ads
    - rule-set:Jinx-Ads
tun:
  enable: true
  stack: mips
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
