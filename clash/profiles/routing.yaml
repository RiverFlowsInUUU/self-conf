# ============================================================================
#  routing · 分流版（由 override/my_clash.js 生成）
# ============================================================================
#  本文件由覆写脚本 override/my_clash.js 生成，策略组与规则结构与脚本
#  覆写后的订阅一致（23 个策略组 / 22 份规则集 / 24 条规则）。
#
# ⚠️ 导入前要改一处：
#    `proxy-providers.Airport.url` —— 换成你自己的订阅地址。
#    不换的话所有走代理的流量不通（占位地址是 example.com，不是真实服务）。
#
# 🧠 Smart 三档（本模板专属，脚本侧无此结构）：
#    Smart 为 fallback，依次回落到三个隐藏的 url-test 子组 ——
#      Low Mult.   倍率 < 1 的节点（0.01 / 0.1 / 0.5 …）· 最省钱，优先
#      Auto        正常倍率节点（节点名无倍率标记）
#      High Mult.  倍率 > 1 的节点（1.5倍 / 2倍 / 3.0x …）· 最贵，兜底
#    子组靠 filter 在运行时筛节点，故不依赖生成期可见节点名 ——
#    这正是 provider 订阅下脚本倍率排序做不到、而模板能做的原因。
#
# 🔎 倍率判据（消歧靠「倍率单位」）：
#      低倍率  0.xxx —— 0 开头必是倍率
#      高倍率  数值 >=1 且必须紧跟 倍 / 倍率 / x / X / *
#      其余    视为无倍率标记 -> Auto
#
# 📦 本仓自托管规则集（rules/ 目录，format: yaml）：
#      emby.yaml          4 条自用枚举域名 → Emby
#      AI_Domains.yaml    272 条 AI 伴生域 → AI（补 category-ai-chat-!cn 漏掉的 93 条）
#      apple_system.yaml  18 条 Apple 系统域 → DIRECT（Surge 内置 SYSTEM 快照）
#    与姊妹仓 Self-Configuration 同构，但自托管不跨项目引用。
#
# 🔁 节点来源：订阅节点由 `Airport` provider 拉取，各策略组用
#    `include-all`（proxies + providers）引入，无需手动列节点。
#
# 💡 想让**自己的订阅**也长成这样而不改本文件？
#    直接用 override/my_clash.js 挂到订阅上。
#
# 🔒 IPv6 显式关闭（ipv6: false + dns.ipv6: false）：不返回 AAAA 记录，
#    双栈站点自动回落 IPv4，避免本机真实 IPv6 绕过 TUN 出网。
#    与姊妹仓 Self-Configuration（双内核同为关闭）对齐。
#
# 📌 本文件没有版本号，是长期沿用的「分流版」入口。
# ============================================================================

ipv6: false
proxy-providers:
  Airport:
    type: http
    url: https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    path: ./proxy_provider/Airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Smart
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/Proxy.png
  - name: Smart
    type: fallback
    proxies:
      - Low Mult.
      - Auto
      - High Mult.
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/Auto.png
  - name: Low Mult.
    type: url-test
    include-all: true
    filter: '^(?=.*(?:^|[^\d.])(0\.\d*[1-9]))((?!直连|DIRECT).)*$'
    exclude-filter: 剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: Auto
    type: url-test
    include-all: true
    filter: '^(?!.*(?:^|[^\d.])(0\.\d*[1-9]))(?!.*(?:^|[^\d.])([1-9]\d*(?:\.\d+)?\s*(?:倍率|倍|x|X|\*)))((?!直连|DIRECT).)*$'
    exclude-filter: 剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: High Mult.
    type: url-test
    include-all: true
    filter: '^(?=.*(?:^|[^\d.])([1-9]\d*(?:\.\d+)?\s*(?:倍率|倍|x|X|\*)))((?!直连|DIRECT).)*$'
    exclude-filter: 剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
