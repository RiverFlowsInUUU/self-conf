# ============================================================================
# lazy · 懒人版
#
# 3 个策略组（Proxy / AI / AD）+ 1 个隐藏订阅槽位（Airport）+ 11 条规则
# （白名单 / 广告拦截 ×2 / 内网 ×2 / Apple 系统服务 / AI 分流 ×2 / 国内直连 ×2 / 兜底）。
# 全部流量走一个出口。
#
# 🧬 结构蓝本 = Self-Configuration 仓库的 lazy_v2.0.1（Surge / Egern 双内核同款拓扑）：
#    组分工、规则次序逐项对齐；
#    Surge 的 pre-matching REJECT 与 Egern 的 dns.forward reject 在 mihomo 没有对应物，
#    广告拦截统一落在规则层（AD 组，与 Egern 侧同形）。
#
# ⚠️ 导入前要动两处（至少填一项，否则所有走代理的流量不通）：
#   ① `proxy-providers.Airport.url` —— 换成你自己的订阅地址；
#   ② `proxies` 里两条占位节点 —— 按实际协议替换 `server` / `port` / `password` / `sni`，
#      或整条删掉（只用订阅）。`203.0.113.0/24` 是 RFC 5737 文档段，不会指向真实主机；
#      server 写 IP 字面量 ⇒ 节点不产生「解析节点域名」这次查询。
#
# 📌 本文件没有版本号，是长期沿用的「懒人版」入口。
#    「分流版」（按应用 + 按地区）见同目录 `routing.yaml`。
# ============================================================================

# 🔒 IPv6 显式关闭：不返回 AAAA 记录，双栈站点自动回落 IPv4，
#    避免本机真实 IPv6 绕过 TUN 出网导致出口 IP 与节点不符（与分流版同口径）。

ipv6: false

# ============================================================================
# ① proxies —— 节点。**本段为空**：节点全部来自 `Airport` 订阅，
#    只填一个订阅 URL 即可导入，不需要手工补节点。
#    若你有自己的固定节点，可直接写在这里（`type` / `server` / `port` 等按需填），
#    它们与订阅节点合并进各组。
# ② proxy-providers —— 订阅槽位，见下。
#
# ⚡ 导入前至少填一项（两个都不填 ⇒ 所有走代理的流量不通）。
# ============================================================================
# 节点全部来自 `Airport` 订阅 —— 本段为空，只填一个订阅 URL 即可导入。
proxies: []

# ============================================================================
# 订阅槽位：把 url 换成你自己的订阅地址，`proxy-groups` 里靠 `use` 引用它。
# health-check 只影响面板里的延迟读数，不影响可用性。
# ============================================================================
proxy-providers:
  Airport:
    type: http
    url: https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    path: ./proxy_provider/Airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ============================================================================
# 策略组：3 个
#   Proxy  主出口，url-test 自动择优（≙ 蓝图的 smart 组：按延迟自动选，无需手动管）
#          ⚠️ 只是近似 —— mihomo **没有 `smart` 组类型、也没有节点权重机制**，
#          暂时就用 `url-test`（纯延迟择优）。详见 routing.yaml 策略组段首的两条缺口。
#   AI     AI 域名的独立出口，select 手动钉死 —— 蓝图 2026-09-28 的定案：
#          自动测速会让出口 IP 在订阅池里漂移，而 Google/OpenAI 的账号风控对
#          出口频繁跳变极敏感，AI 流量必须手动固定。
#   AD     广告拦截开关。只有一个子策略 REJECT（与蓝图两内核一致）——
#          想临时放行某个广告域名，在 rules 里加一条更靠前的 domain 规则指向
#          DIRECT 即可，别整组切走（那等于关掉全部拦截）。
#
# 组的节点来源由两块拼起来：
#   · `proxies` —— 空段；节点全部来自订阅
#   · `use`     —— `proxy-providers` 里订阅 `Airport` 的全部节点。
# `AI` 的默认出口是 `Proxy`（组名可直接当成员），随主出口自动择优。
#
# ⚠️ mihomo 里 `include-all: true` 会把 `use` 覆盖成「全部 provider」。只有一个
#    provider 时两者等价；日后加了第二个 provider 又只想用其中一个，就去掉
#    `include-all`、只留 `use`。
# ============================================================================
proxy-groups:
  - name: Proxy
    type: url-test
    proxies: []
    use:
      - Airport
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/Proxy.png
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: AI
    type: select
    proxies:
      - Proxy
    use:
      - Airport
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/grok.png
  - name: AD
    type: select
    # 单成员 REJECT —— 与姊妹仓懒人版同口径（该仓 893b406 有意收敛）。
    # 分流版才是 REJECT / DIRECT 二选一；懒人版定位极简，不留放行的口子。
    proxies:
      - REJECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/icons/AdBlock.png

# ============================================================================
# 规则集：5 份，按「GEOSITE → MRS → 传统规则集」三级选型后落在本层的 3 份：
#   jinx-white-guard  白名单（classical YAML，自托管 Jinx 仓）—— 自定义功能域清单，
#                     内核数据库里没有对应物，只能走传统层
#   jinx-ads          广告拦截主清单（classical YAML，自托管 Jinx 仓）—— 同上
#   AWAvenue-Ads      广告拦截第 2 条（.mrs）—— 上游提供 mihomo 二进制格式，优先于文本
#   AI-Domains        AI 伴生域/宽后缀（classical text，自托管于 Self-Configuration 仓）——
#                     googleapis.com 整域收编这类「导向 AI 组」的自定义去向，
#                     GEOSITE 的 AI 类目只收 -pa 系 API 端点，接不住整域后缀
#   apple-system      Apple 系统服务 18 条（classical text，自托管于 Self-Configuration 仓）——
#                     「只要系统服务、不要全量 Apple」的精确切面没有对应 GEOSITE 类目
# 全部落盘到本地、24 小时刷新一次，节点侧不依赖在线下载。
# 其余 6 条规则全部由 GEOSITE / GEOIP 原生数据库承接（见 rules 段注释）。
# ============================================================================
rule-providers:
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs
    path: ./rule_provider/AWAvenue-Ads-Rule-Clash.mrs
    interval: 86400
  Jinx-Ads:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/mihomo-ads.yaml
    path: ./rule_provider/Jinx-Ads.yaml
    interval: 86400
  Jinx-CN:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/mihomo-direct.yaml
    path: ./rule_provider/Jinx-CN.yaml
    interval: 86400
  AI_Domains:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/rules/AI_Domains.yaml
    path: ./rule_provider/AI_Domains.yaml
    interval: 86400
  apple-system:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Clash/main/rules/apple_system.yaml
    path: ./rule_provider/apple_system.yaml
    interval: 86400

  # ── MRS 规则集（原 GEOSITE / GEOIP 原生层，改为与分流版同口径的远程集）──
  private:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
    path: ./rule_provider/private.mrs
    interval: 86400
  cn:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./rule_provider/cn.mrs
    interval: 86400
  category-ai-chat-!cn:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-chat-!cn.mrs
    path: ./rule_provider/category-ai-chat-!cn.mrs
    interval: 86400
  geoip-private:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs
    path: ./rule_provider/geoip-private.mrs
    interval: 86400
  geoip-cn:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs
    path: ./rule_provider/geoip-cn.mrs
    interval: 86400

# ============================================================================
# 规则：自上而下匹配，第一条命中即决定去向（11 条，与蓝图 lazy_v2.0.1 逐位对应）。
#   ① 白名单      ② 广告拦截 ×2      ③ 内网 ×2      ④ Apple 系统服务
#   ⑤ AI 分流 ×2  ⑥ 国内域名 + 国内 IP             ⑦ 兜底
#
# 三级选型后落在 GEOSITE / GEOIP 原生层的 6 条：
#   GEOSITE,private / GEOSITE,cn / GEOSITE,category-ai-chat-!cn —— 蓝图的
#     private.txt（Lan+Private）、direct.txt（约 11 万条国内域名）、Repcz AI.list
#     分别与 v2fly 的 private / cn / category-ai-chat-!cn 类目同源同覆盖，
#     全部收敛进内核数据库，不再挂远程规则集；
#   GEOIP,private / GEOIP,cn —— 蓝图的 Lan.list IP 段与 geoip CN。
#
# ⚠️ ① 必须留在 ② 之前 —— AWAvenue 与 Jinx 黑名单存在重叠域名，
#    顺序颠倒会把白名单里的功能域误杀。
# ⚠️ 两条 GEOIP（③⑥）**不带 no-resolve**：走到它们的域名会多触发一次本地解析。
#    本地解析走的是加密解析器，不产生明文，代价只是首个请求多一次解析耗时。
# ============================================================================
rules:
  # ① 白名单 —— 抢在广告规则之前放行
  - RULE-SET,Jinx-CN,DIRECT
  # ② 广告拦截 —— 两条并列清单，同一出口 AD
  - RULE-SET,Jinx-Ads,AD
  - RULE-SET,AWAvenue-Ads,AD
  # ③ 内网：私有 IP 段 + 私有域名，一律直连（≙ 蓝图 Lan.list + private.txt 两条）
  - RULE-SET,geoip-private,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  # ④ Apple 系统服务（激活 / 推送 / 定位 / 配对）—— 全量 Apple 不在此列：
  #    懒人版只有一个出口，Apple 流量「部分直连、部分走代理」的完整切分是分流版的活
  - RULE-SET,apple-system,DIRECT
  # ⑤ AI 分流：通用 AI 类目兜底在前收散域名，伴生域/宽后缀随后整域收编
  #   （googleapis.com / googleusercontent.com 整域归 AI，不漏进国内或兜底）
  - RULE-SET,category-ai-chat-!cn,AI
  - RULE-SET,AI_Domains,AI
  # ⑥ 国内：域名集在前、IP 集在后，都直连
  - RULE-SET,cn,DIRECT
  - RULE-SET,geoip-cn,DIRECT,no-resolve
  # ⑦ 兜底：以上都没命中，走主出口（蓝图 2026-09-23 起：兜底一跳直连 Proxy，无 Final 中间组）
  - MATCH,Proxy

# ============================================================================
# dns 段 —— 防泄露的三个支点，缺一条就漏：
#
#   ① 解析器全部加密：`nameserver` / `proxy-server-nameserver` / `direct-nameserver` /
#      `nameserver-policy` 四处都是 `https://…/dns-query`（DoH，443 加密），
#      没有一条明文递归；
#   ② 明文入口收口：见 tun 段的 `auto-route` + `strict-route` + `dns-hijack: any:53`，
#      应用自己发的明文查询会被内核接管，而不是放出去；
#   ③ 代理域名不给真实答案：`enhanced-mode: fake-ip` 只回假 IP，真实解析在落地侧完成。
#
# 🔎 `default-nameserver` 是引导解析器，只用于**解析 DoH 端点自身的域名** —— 本段需要
#    它的只有 `dns.google` 与 `dns.cloudflare.com` 两条。其余键都写成 IP 端点
#    （223.5.5.5 / 120.53.53.53），不需要任何引导。
#
# 四个键各管一段路（别混用）：
#   nameserver               主解析器 —— 需要本地解析出真实 IP 的域名
#   nameserver-policy        按域名换解析器，本段把 `geosite:private,cn` 交回国内 DoH
#   proxy-server-nameserver  只解析**代理节点域名**（连节点前还没有代理可用，鸡生蛋）
#   direct-nameserver        只解析 **DIRECT 出站**的域名 —— 直连流量也不碰系统 DNS
# ⚠️ `respect-rules: true` 让 DNS 查询自己也受路由规则管辖，内核强制要求同时给出
#    `proxy-server-nameserver`，缺了直接报错。
# ============================================================================
dns:
  enable: true
  # IPv6 关闭：AAAA 查询由内核直接回空应答，不往外发
  ipv6: false
  # 内核 DNS 服务的监听地址，供局域网设备直接指向
  listen: 0.0.0.0:7874
  # 代理域名只回假 IP，真实解析推给落地侧
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # DoH 不优先 HTTP/3（只用 HTTP/1.1 + HTTP/2）
  prefer-h3: false
  # DNS 查询也走路由规则：发往境外 DoH 的查询会按规则经代理发出
  respect-rules: true
  # 优先查配置里的 hosts；不读系统 hosts 文件
  use-hosts: true
  use-system-hosts: false
  # ⚠️ 下列域名**跳过 fake-ip**、走真实解析 —— NTP / 游戏机 / 局域网 / 微软联网探测
  #    这类东西拿到假 IP 会直接失效。通配语义：`+.` 含本域与任意层子域；`*` / `*.` 只匹配一层。
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "stun.*"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.market.xiaomi.com"
    # 广告清单：必须与 nameserver-policy 中的广告项一一对应，否则 DNS 层拦截不生效
    - "rule-set:AWAvenue-Ads"
    - "rule-set:Jinx-Ads"
  # 引导解析器：只解析 DoH 端点自身的域名。内核要求必须是纯 IP，不能写域名。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点域名：端点写 IP，无需引导
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  # 直连出站的域名
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  # 主解析器：境外 DoH
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  # 按域名换解析器。
  # ⚠️ 广告两项**必须排在** `geosite:private,cn` 之前 —— 否则先命中 cn 就拿不到空回答。
  # ⚠️ 广告域名还**必须在** `fake-ip-filter` 里再列一遍（见上），否则 withFakeIP 中间件
  #    对 A / AAAA 查询直接返回假 IP，请求永远到不了本段。
  nameserver-policy:
    "rule-set:AWAvenue-Ads": rcode://success
    "rule-set:Jinx-Ads": rcode://success
    "geosite:private,cn":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query

# ============================================================================
# tun 段 —— dns 段的收口装置。
#
# `auto-route` + `strict-route`：把设备全部出站流量强制拉进 TUN，绕不过去；
# `dns-hijack: any:53`：命中 53 端口的连接不往外发，直接交给内核 DNS 模块应答。
# 这两条合起来，才是「应用直接问 8.8.8.8:53」也被收住的原因。
# ⚠️ 官方语义：不写协议前缀时默认 `udp://`，即 `any:53` 收的是 UDP:53；
#    要把 TCP:53 也收进来，再加一条 `tcp://any:53`。
# `stack: mips` 是 mihomo 自研的 IP 协议栈（可选值 system / gvisor / mixed / mips）。
# ============================================================================
tun:
  enable: true
  stack: mips
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
